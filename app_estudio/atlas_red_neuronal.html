\", fill=\"x\", pady=(8, 0))", "        ttk.Label(esc, text=\"Escenarios de prueba (3 entradas):\").pack(anchor=\"w\")", "        fila_esc = ttk.Frame(esc)", "        fila_esc.pack(fill=\"x\")", "        for nombre in ESCENARIOS:", "            self._ver_codigo(ttk.Button(fila_esc, text=nombre, width=10,", "                                        command=lambda n=nombre: self._escenario(n)),", "                             self._escenario).pack(side=\"left\", padx=1)", "", "        # ---------------- Red ----------------", "        red = ttk.LabelFrame(f, text=\"Red neuronal y entrenamiento\", padding=8)", "        red.pack(fill=\"x\", pady=4)", "        self.v_ocultas, _ = self._campo(red, 0, \"Neuronas por capa oculta (separadas por ;)\",", "                                        \"; \".join(str(n) for n in cfg[\"ocultas\"]), 12,", "                                        codigo=RedNeuronal.__init__)", "        self.lbl_arquitectura = ttk.Label(red, style=\"Arquitectura.TLabel\")", "        self.lbl_arquitectura.grid(row=1, column=0, columnspan=2, sticky=\"w\", pady=(0, 6))", "        self.v_tasa, _ = self._campo(red, 2, \"Tasa de aprendizaje\", fmt(cfg[\"tasa\"]),", "                                     codigo=RedNeuronal._aplicar)", "        self.v_ajuste, _ = self._lista(red, 3, \"Ajuste de los pesos\", list(TEXTO_AJUSTE.values()),", "                                       TEXTO_AJUSTE[cfg[\"ajuste\"]], 18, codigo=RedNeuronal.entrenar)", "        self.v_tipo_momento, _ = self._lista(red, 4, \"Momento\", list(TEXTO_MOMENTO.values()),", "                                             TEXTO_MOMENTO[cfg[\"tipo_momento\"]], 24,", "                                             codigo=RedNeuronal._aplicar)", "        self.v_momento, self.e_momento = self._campo(red, 5, \"   Momento (Peso·Momento)\", fmt(cfg[\"momento\"]),", "                                                     codigo=ajuste_profesor)", "        self.v_alfa, self.e_alfa = self._campo(red, 6, \"   α del momento clásico\", fmt(cfg[\"alfa\"]),", "                                               codigo=ajuste_momento_clasico)", "        self.v_epocas, _ = self._campo(red, 7, \"Número máximo de épocas\", str(cfg[\"max_epocas\"]),", "                                       codigo=RedNeuronal.entrenar)", "        self.v_ecm, _ = self._campo(red, 8, \"ECM objetivo (se detiene al llegar)\", fmt(cfg[\"ecm_objetivo\"]),", "                                    codigo=RedNeuronal.entrenar)", "        self.v_sesgo = tk.BooleanVar(value=cfg[\"usar_sesgo\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Usar sesgo θ con entrada fija x0 =\",", "                                         variable=self.v_sesgo),", "                         RedNeuronal.__init__).grid(row=9, column=0, sticky=\"w\")", "        self.v_x0 = tk.StringVar(value=str(cfg[\"x0\"]))", "        self._ver_codigo(ttk.Combobox(red, textvariable=self.v_x0, values=(\"-1\", \"+1\"), state=\"readonly\",", "                                      width=4), suma_ponderada).grid(row=9, column=1, sticky=\"w\", padx=4)", "        self.v_normalizar = tk.BooleanVar(value=cfg[\"normalizar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Normalizar las entradas a [0, 1] (F16)\",", "                                         variable=self.v_normalizar),", "                         ex.entrada_de_la_red).grid(row=10, column=0, columnspan=2, sticky=\"w\")", "        self.v_barajar = tk.BooleanVar(value=cfg[\"barajar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Barajar los patrones (solo en el ajuste por patrón)\",", "                                         variable=self.v_barajar),", "                         ex.GeneradorAleatorio.barajar).grid(row=11, column=0, columnspan=2, sticky=\"w\")", "        self.v_semilla, _ = self._campo(red, 12, \"Semilla (vacía = aleatoria)\", \"\",", "                                        codigo=ex.GeneradorAleatorio.__init__)", "        self.v_registrar = tk.BooleanVar(value=cfg[\"registrar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Registrar el proceso paso a paso; épocas:\",", "                                         variable=self.v_registrar),", "                         RedNeuronal._anotar_patron).grid(row=13, column=0, sticky=\"w\")", "        self.v_epocas_reg = tk.StringVar(value=str(cfg[\"epocas_registro\"]))", "        self._ver_codigo(ttk.Entry(red, textvariable=self.v_epocas_reg, width=5),", "                         RedNeuronal._anotar_patron).grid(row=13, column=1, sticky=\"w\", padx=4)", "        ttk.Label(red, style=\"Nota.TLabel\", justify=\"left\",", "                  text=\"Con el ajuste por época, G suma los N patrones: si la tasa es grande\\n\"", "                       \"el error oscila; con muchos puntos conviene una tasa pequeña.\").grid(", "            row=14, column=0, columnspan=2, sticky=\"w\", pady=(6, 0))", "        self.lbl_paso = self._ver_codigo(tk.Label(red, justify=\"left\", anchor=\"w\", wraplength=540,", "                                                  font=(\"Segoe UI\", 9, \"bold\"), bg=FONDO),", "                                         ex.guia_paso)", "        insertar_fila(red, 3)                 # justo debajo de la tasa de aprendizaje", "        self.lbl_paso.grid(row=3, column=0, columnspan=2, sticky=\"w\", pady=(0, 4))", "", "        acciones = ttk.Frame(f)", "        acciones.pack(fill=\"x\", pady=10)", "        self.btn_entrenar = self._ver_codigo(", "            ttk.Button(acciones, text=\"▶  ENTRENAR\", style=\"Accion.TButton\", command=self.entrenar),", "            ex.ejecutar)", "        self.btn_entrenar.pack(side=\"left\", fill=\"x\", expand=True)", "        self.btn_parar = self._ver_codigo(", "            ttk.Button(acciones, text=\"■ Detener\", command=self.detener_entrenamiento, state=\"disabled\"),", "            RedNeuronal.entrenar)", "        self.btn_parar.pack(side=\"left\", padx=(6, 0), ipady=6)", "        self.botones_entrenar.append(self.btn_entrenar)", "        self.botones_parar.append(self.btn_parar)", "", "        prueba = ttk.LabelFrame(f, text=\"Clasificar un punto nuevo (después de entrenar)\", padding=8)", "        prueba.pack(fill=\"x\", pady=4)", "        ttk.Label(prueba, text=\"x1; x2; ...\").pack(side=\"left\")", "        self.v_punto = tk.StringVar(value=\"5; 5; 5\")", "        self._ver_codigo(ttk.Entry(prueba, textvariable=self.v_punto, width=22),", "                         ex.clasificar_punto).pack(side=\"left\", padx=6)", "        self._ver_codigo(ttk.Button(prueba, text=\"Clasificar\", command=self.clasificar_punto),", "                         ex.clasificar_punto).pack(side=\"left\")", "", "        for var in (self.v_ocultas, self.v_nentradas, self.v_nclases, self.v_tipo):", "            var.trace_add(\"write\", lambda *a: self._actualizar_arquitectura())", "        for var in (self.v_tasa, self.v_npc, self.v_nclases, self.v_tipo, self.v_ajuste,", "                    self.v_tipo_momento, self.v_alfa):", "            var.trace_add(\"write\", lambda *a: self._actualizar_paso())", "        self.v_tipo_momento.trace_add(\"write\", lambda *a: self._activar_momento())", "        self._construir_tabla()", "        self._cambio_tipo()", "        self._activar_momento()", "        self._actualizar_paso()", "", "    def _mostrar_paso(self, etiqueta, texto, nivel):", "        etiqueta.configure(text=texto, fg=\"#B03A2E\" if nivel == \"alto\" else \"#1E7B3A\")", "", "    def _actualizar_paso(self):", "        \"\"\"Muestra la relación tasa × N (ver experimentos.guia_paso).\"\"\"", "        try:", "            tasa = float(self.v_tasa.get().replace(\",\", \".\"))", "            N = int(self.v_npc.get()) * self._n_clases()", "            alfa = float(self.v_alfa.get().replace(\",\", \".\"))", "        except ValueError:", "            self.lbl_paso.configure(text=\"\")", "            return", "        ajuste = \"patron\" if self.v_ajuste.get() == TEXTO_AJUSTE[\"patron\"] else \"epoca\"", "        tipo = \"clasico\" if self.v_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"] else \"profesor\"", "        self._mostrar_paso(self.lbl_paso, *ex.guia_paso(tasa, N, ajuste, tipo, alfa))", "", "    # --- tabla de clases ---", "    def _n_entradas(self):", "        try:", "            return maximo([1, minimo([MAX_ENTRADAS, int(self.v_nentradas.get())])])", "        except ValueError:", "            return 3", "", "    def _n_clases(self):", "        if self.v_tipo.get() != \"nubes\":", "            return 2", "        try:", "            return maximo([2, minimo([MAX_CLASES, int(self.v_nclases.get())])])", "        except ValueError:", "            return 2", "", "    def _construir_tabla(self):", "        for hijo in self.marco_tabla.winfo_children():", "            hijo.destroy()", "        n = self._n_entradas()", "        nombres = \"; \".join(\"x%d\" % (j + 1) for j in range(minimo([n, 4]))) + (\"; ...\" if n > 4 else \"\")", "        for col, txt in enumerate([\"Clase\", \"Media (%s)\" % nombres, \"Desv.\", \"Distribución\"]):", "            ttk.Label(self.marco_tabla, text=txt, style=\"Encabezado.TLabel\").grid(", "                row=0, column=col, padx=2, sticky=\"w\")", "        for k, fila in enumerate(self.filas_clase):", "            tk.Label(self.marco_tabla, text=\" %d \" % (k + 1), bg=gr.color_clase(k), fg=\"white\",", "                     font=(\"Segoe UI\", 9, \"bold\")).grid(row=k + 1, column=0, pady=2)", "            widgets = [ttk.Entry(self.marco_tabla, textvariable=fila[\"centro\"], width=26),", "                       ttk.Entry(self.marco_tabla, textvariable=fila[\"desv\"], width=6),", "                       ttk.Combobox(self.marco_tabla, textvariable=fila[\"dist\"], values=DISTRIBUCIONES,", "                                    state=\"readonly\", width=11)]", "            for col, wdg in enumerate(widgets):", "                wdg.grid(row=k + 1, column=col + 1, padx=2, pady=2, sticky=\"w\")", "                self._ver_codigo(wdg, ex.generar_nubes if not isinstance(wdg, ttk.Combobox)", "                                 else ex.GeneradorAleatorio.muestra)", "        self._actualizar_arquitectura()", "", "    def _cambio_entradas(self):", "        n = self._n_entradas()", "        self.v_nentradas.set(str(n))", "        actuales = [len(leer_vector_seguro(f[\"centro\"].get())) for f in self.filas_clase]", "        if any(a != n for a in actuales):", "            centros = ex.centros_por_defecto(len(self.filas_clase), n)", "            for fila, c in zip(self.filas_clase, centros):", "                fila[\"centro\"].set(fmt_vector(c))", "            self.v_punto.set(fmt_vector([5] * n))", "        self._construir_tabla()", "", "    def _cambio_clases(self):", "        if self.v_tipo.get() != \"nubes\":", "            return", "        k = self._n_clases()", "        self.v_nclases.set(str(k))", "        if k == len(self.filas_clase):", "            return", "        centros = ex.centros_por_defecto(k, self._n_entradas())", "        while len(self.filas_clase) < k:", "            j = len(self.filas_clase)", "            self.filas_clase.append({\"centro\": tk.StringVar(value=fmt_vector(centros[j])),", "                                     \"desv\": tk.StringVar(value=\"1\"),", "                                     \"dist\": tk.StringVar(value=\"normal\")})", "        del self.filas_clase[k:]", "        self._construir_tabla()", "", "    def _cambio_tipo(self):", "        tipo = self.v_tipo.get()", "        for marco in (self.marco_nubes, self.marco_xor, self.marco_esfera):", "            marco.pack_forget()", "        {\"nubes\": self.marco_nubes, \"xor\": self.marco_xor, \"esfera\": self.marco_esfera}[tipo].pack(", "            fill=\"x\", pady=(2, 0))", "        self.sp_clases.configure(state=\"normal\" if tipo == \"nubes\" else \"disabled\")", "        if tipo != \"nubes\":", "            self.v_nclases.set(\"2\")", "        else:", "            self.v_nclases.set(str(len(self.filas_clase)))", "        self._actualizar_arquitectura()", "", "    def _actualizar_arquitectura(self):", "        try:", "            ocultas = leer_ocultas(self.v_ocultas.get())", "        except ValueError:", "            self.lbl_arquitectura.configure(text=\"Arquitectura: (revise las neuronas por capa)\")", "            return", "        k = self._n_clases()", "        salidas = 1 if k == 2 else k", "        capas = [self._n_entradas()] + ocultas + [salidas]", "        texto = \"Arquitectura: \" + \" → \".join(str(c) for c in capas)", "        texto += \"   (%d capa%s oculta%s, %d salida%s)\" % (", "            len(ocultas), \"\" if len(ocultas) == 1 else \"s\", \"\" if len(ocultas) == 1 else \"s\",", "            salidas, \"\" if salidas == 1 else \"s\")", "        self.lbl_arquitectura.configure(text=texto)", "", "    def _activar_momento(self):", "        clasico = self.v_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"]", "        self.e_momento.configure(state=\"disabled\" if clasico else \"normal\")", "        self.e_alfa.configure(state=\"normal\" if clasico else \"disabled\")", "", "    def _centros_auto(self):", "        centros = centros_automaticos(len(self.filas_clase), self._n_entradas())", "        for fila, c in zip(self.filas_clase, centros):", "            fila[\"centro\"].set(fmt_vector(c))", "", "    def _escenario(self, nombre):", "        \"\"\"Carga un escenario de 3 entradas. Las nubes cargan sus 3 clases; para", "        XOR y esfera la tabla de nubes también se ajusta a 3 entradas, para que", "        al volver a 'Nubes' no queden medias con otro número de coordenadas.\"\"\"", "        e = ESCENARIOS[nombre]", "        self.v_tipo.set(e[\"tipo\"])", "        self.v_nentradas.set(\"3\")", "        self._cambio_entradas()", "        if e[\"tipo\"] == \"nubes\":", "            k = len(e[\"centros\"])", "            self.v_nclases.set(str(k))", "            self.filas_clase = [{\"centro\": tk.StringVar(value=fmt_vector(e[\"centros\"][j])),", "                                 \"desv\": tk.StringVar(value=fmt(e[\"desv\"])),", "                                 \"dist\": tk.StringVar(value=e[\"dist\"][j])} for j in range(k)]", "        self.v_ocultas.set(e[\"ocultas\"])", "        self.v_tasa.set(e[\"tasa\"])", "        self.v_epocas.set(e[\"epocas\"])", "        self.v_punto.set(\"5; 5; 5\")", "        self._construir_tabla()", "        self._cambio_tipo()", "        self.estado.configure(text=\"Escenario '%s' cargado: presione ENTRENAR.\" % nombre)", "", "    def _mover_medias(self, factor):", "        \"\"\"Acerca (factor < 1) o aleja (factor > 1) cada centro respecto al centro", "        común de las clases:  c_nuevo = centro_comun + factor * (c - centro_comun).\"\"\"", "        try:", "            n = self._n_entradas()", "            centros = [leer_vector(f[\"centro\"].get(), \"Media de la clase %d\" % (k + 1), n)", "                       for k, f in enumerate(self.filas_clase)]", "        except ValueError as error:", "            messagebox.showerror(\"Dato no válido\", str(error))", "            return", "        comun = [media([c[j] for c in centros]) for j in range(n)]                # F22", "        for fila, c in zip(self.filas_clase, centros):", "            fila[\"centro\"].set(fmt_vector([float(\"%.3g\" % (comun[j] + factor * (c[j] - comun[j])))", "                                           for j in range(n)]))", "        self.entrenar()", "", "    def _escalar_sigma(self, factor):", "        try:", "            for k, fila in enumerate(self.filas_clase):", "                s = leer_positivo(fila[\"desv\"], \"Desviación de la clase %d\" % (k + 1), cero=True) * factor", "                fila[\"desv\"].set(fmt(float(\"%.3g\" % s)))", "        except ValueError as error:", "            messagebox.showerror(\"Dato no válido\", str(error))", "            return", "        self.entrenar()", "", "    def _config(self):", "        cfg = ex.config_por_defecto()", "        n = leer_int(self.v_nentradas, \"Entradas\", 1, MAX_ENTRADAS)", "        cfg[\"n_entradas\"] = n", "        cfg[\"tipo_datos\"] = self.v_tipo.get()", "        cfg[\"n_por_clase\"] = leer_int(self.v_npc, \"Puntos por clase\", 1, 5000)", "        if cfg[\"tipo_datos\"] == \"nubes\":", "            cfg[\"n_clases\"] = len(self.filas_clase)", "            cfg[\"clases\"] = []", "            for k, fila in enumerate(self.filas_clase):", "                cfg[\"clases\"].append({", "                    \"centro\": leer_vector(fila[\"centro\"].get(), \"Media de la clase %d\" % (k + 1), n),", "                    \"desviacion\": leer_positivo(fila[\"desv\"], \"Desviación de la clase %d\" % (k + 1), cero=True),", "                    \"distribucion\": fila[\"dist\"].get()})", "        elif cfg[\"tipo_datos\"] == \"xor\":", "            cfg[\"n_clases\"] = 2", "            cfg[\"xor_desviacion\"] = leer_positivo(self.v_xor_desv, \"Desviación de cada esquina\", cero=True)", "            cfg[\"xor_lado\"] = leer_positivo(self.v_xor_lado, \"Lado del cubo\")", "            cfg[\"distribucion_xor\"] = self.v_xor_dist.get()", "            esquinas = int(potencia_entera(2.0, n))                          # 2^n", "            if esquinas > 2 * cfg[\"n_por_clase\"]:", "                raise ValueError(\"El XOR con %d entradas tiene %d esquinas: use al menos %d puntos por clase.\"", "                                 % (n, esquinas, esquinas // 2))", "        else:", "            cfg[\"n_clases\"] = 2", "            cfg[\"esfera_centro\"] = leer_float(self.v_esf_centro, \"Centro de la esfera\")", "            cfg[\"esfera_radio_interno\"] = leer_positivo(self.v_esf_r1, \"Radio de la esfera\")", "            cfg[\"esfera_radio_externo\"] = leer_positivo(self.v_esf_r2, \"Radio externo\")", "            if cfg[\"esfera_radio_externo\"] <= 1.3 * cfg[\"esfera_radio_interno\"]:", "                raise ValueError(\"El radio externo debe ser mayor que 1,3 veces el radio de la esfera\\n\"", "                                 \"(entre las dos clases se deja un espacio vacío).\")", "        cfg[\"ocultas\"] = leer_ocultas(self.v_ocultas.get())", "        cfg[\"tasa\"] = leer_positivo(self.v_tasa, \"Tasa de aprendizaje\")", "        cfg[\"ajuste\"] = \"patron\" if self.v_ajuste.get() == TEXTO_AJUSTE[\"patron\"] else \"epoca\"", "        cfg[\"tipo_momento\"] = \"clasico\" if self.v_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"] else \"profesor\"", "        cfg[\"momento\"] = leer_momento(self.v_momento, cfg[\"tipo_momento\"])", "        cfg[\"alfa\"] = leer_positivo(self.v_alfa, \"α del momento clásico\", cero=True)", "        if cfg[\"tipo_momento\"] == \"clasico\" and cfg[\"alfa\"] >= 1:", "            raise ValueError(\"α debe ser menor que 1: con α >= 1 los cambios se acumulan sin control.\")", "        cfg[\"max_epocas\"] = leer_int(self.v_epocas, \"Número máximo de épocas\", 1, 200000)", "        cfg[\"ecm_objetivo\"] = leer_positivo(self.v_ecm, \"ECM objetivo\", cero=True)", "        cfg[\"usar_sesgo\"] = self.v_sesgo.get()", "        cfg[\"x0\"] = int(self.v_x0.get())", "        cfg[\"normalizar\"] = self.v_normalizar.get()", "        cfg[\"barajar\"] = self.v_barajar.get()", "        cfg[\"semilla\"] = leer_semilla(self.v_semilla)", "        cfg[\"registrar\"] = self.v_registrar.get()", "        cfg[\"epocas_registro\"] = leer_int(self.v_epocas_reg, \"Épocas a registrar\", 1, 50)", "        return cfg", "", "    def clasificar_punto(self):", "        if self.res is None or self.res[\"tipo\"] != \"clasificacion\":", "            messagebox.showinfo(\"Primero entrene\", \"Entrene la red antes de probar un punto.\")", "            return", "        n = len(self.res[\"X\"][0])", "        try:", "            x = leer_vector(self.v_punto.get(), \"Punto nuevo\", n)", "        except ValueError as error:", "            messagebox.showerror(\"Dato no válido\", str(error))", "            return", "        clase = ex.clasificar_punto(self.res, x)", "        y = ex.salida_en_punto(self.res, x)", "        self.res[\"punto\"] = (x, clase)", "        self.pendientes.add(\"espacio\")", "        self.nb_res.select(0)", "        self._redibujar_visible()", "        self.estado.configure(text=\"El punto (%s) se clasifica como %s — salidas de la red y = (%s)\"", "                              % (fmt_vector(x), self.res[\"nombres\"][clase],", "                                 \", \".join(\"%.4f\" % v for v in y)))", "", "    # ------------------------------------------------------------------", "    # Pestaña REGRESIÓN", "    # ------------------------------------------------------------------", "    def _pestana_regresion(self):", "        cfg = ex.config_regresion()", "        m = MarcoDesplazable(self.nb_config)", "        self.nb_config.add(m, text=\" Regresión \")", "        f = m.interior", "        ne = cfg[\"n_entradas\"]", "", "        datos = ttk.LabelFrame(f, text=\"Datos simulados\", padding=8)", "        datos.pack(fill=\"x\", pady=4)", "        fila = ttk.Frame(datos)", "        fila.grid(row=0, column=0, columnspan=2, sticky=\"w\", pady=(0, 6))", "        ttk.Label(fila, text=\"Entradas:\").pack(side=\"left\")", "        self.r_nentradas = tk.StringVar(value=str(ne))", "        sp = ttk.Spinbox(fila, from_=1, to=MAX_ENTRADAS, width=4, textvariable=self.r_nentradas,", "                         command=self._cambio_entradas_regresion)", "        sp.pack(side=\"left\", padx=(4, 12))", "        sp.bind(\"<Return>\", lambda e: self._cambio_entradas_regresion())", "        sp.bind(\"<FocusOut>\", lambda e: self._cambio_entradas_regresion())", "        self._ver_codigo(sp, ex.generar_datos_regresion)", "        ttk.Label(fila, text=\"Puntos:\").pack(side=\"left\")", "        self.r_n = tk.StringVar(value=str(cfg[\"n\"]))", "        self._ver_codigo(ttk.Entry(fila, textvariable=self.r_n, width=6),", "                         ex.generar_datos_regresion).pack(side=\"left\", padx=4)", "        self.r_modelo, _ = self._lista(datos, 1, \"Modelo real\", MODELOS_REGRESION, cfg[\"modelo\"],", "                                       codigo=ex.generar_datos_regresion)", "        self.r_coef, _ = self._campo(datos, 2, \"Coeficientes a (a1; a2; ...)\",", "                                     fmt_vector(cfg[\"coeficientes\"][:ne]), 22,", "                                     codigo=ex.generar_datos_regresion)", "        self.r_b, _ = self._campo(datos, 3, \"Término independiente b\", fmt(cfg[\"sesgo\"]), 8,", "                                  codigo=ex.generar_datos_regresion)", "        self.r_centro, _ = self._campo(datos, 4, \"Media de las entradas (x1; x2; ...)\",", "                                       fmt_vector(cfg[\"centro_x\"][:ne]), 22,", "                                       codigo=ex.generar_datos_regresion)", "        self.r_desv, _ = self._campo(datos, 5, \"Desviación de las entradas\", fmt(cfg[\"desviacion_x\"]), 8,", "                                     codigo=ex.generar_datos_regresion)", "        self.r_dist, _ = self._lista(datos, 6, \"Distribución de las entradas\", DISTRIBUCIONES,", "                                     cfg[\"distribucion_x\"], codigo=ex.GeneradorAleatorio.muestra)", "        self.r_ruido, _ = self._campo(datos, 7, \"Desviación del ruido\", fmt(cfg[\"desviacion_ruido\"]), 8,", "                                      codigo=ex.generar_datos_regresion)", "        self.r_dist_ruido, _ = self._lista(datos, 8, \"Distribución del ruido\", DISTRIBUCIONES,", "                                           cfg[\"distribucion_ruido\"], codigo=ex.GeneradorAleatorio.muestra)", "        self.r_formula = ttk.Label(datos, style=\"Nota.TLabel\", justify=\"left\")", "        self.r_formula.grid(row=9, column=0, columnspan=2, sticky=\"w\", pady=(6, 0))", "        esc = ttk.Frame(datos)", "        esc.grid(row=10, column=0, columnspan=2, sticky=\"w\", pady=(8, 0))", "        ttk.Label(esc, text=\"Escenarios:\").pack(side=\"left\")", "        for nombre in ESCENARIOS_REGRESION:", "            self._ver_codigo(ttk.Button(esc, text=nombre, width=11,", "                                        command=lambda n=nombre: self._escenario_regresion(n)),", "                             self._escenario_regresion).pack(side=\"left\", padx=1)", "", "        red = ttk.LabelFrame(f, text=\"Red neuronal y entrenamiento\", padding=8)", "        red.pack(fill=\"x\", pady=4)", "        self.r_ocultas, _ = self._campo(red, 0, \"Neuronas por capa oculta (separadas por ;)\",", "                                        \"; \".join(str(n) for n in cfg[\"ocultas\"]), 12,", "                                        codigo=RedNeuronal.__init__)", "        self.r_arquitectura = ttk.Label(red, style=\"Arquitectura.TLabel\")", "        self.r_arquitectura.grid(row=1, column=0, columnspan=2, sticky=\"w\", pady=(0, 6))", "        self.r_salida, _ = self._lista(red, 2, \"Neurona de salida\", list(TEXTO_SALIDA.values()),", "                                       TEXTO_SALIDA[cfg[\"salida\"]], 24, codigo=ex.ejecutar_regresion)", "        self.r_tasa, _ = self._campo(red, 3, \"Tasa de aprendizaje\", fmt(cfg[\"tasa\"]),", "                                     codigo=RedNeuronal._aplicar)", "        self.r_ajuste, _ = self._lista(red, 4, \"Ajuste de los pesos\", list(TEXTO_AJUSTE.values()),", "                                       TEXTO_AJUSTE[cfg[\"ajuste\"]], 18, codigo=RedNeuronal.entrenar)", "        self.r_tipo_momento, _ = self._lista(red, 5, \"Momento\", list(TEXTO_MOMENTO.values()),", "                                             TEXTO_MOMENTO[cfg[\"tipo_momento\"]], 24,", "                                             codigo=RedNeuronal._aplicar)", "        self.r_momento, self.re_momento = self._campo(red, 6, \"   Momento (Peso·Momento)\",", "                                                      fmt(cfg[\"momento\"]), codigo=ajuste_profesor)", "        self.r_alfa, self.re_alfa = self._campo(red, 7, \"   α del momento clásico\", fmt(cfg[\"alfa\"]),", "                                                codigo=ajuste_momento_clasico)", "        self.r_epocas, _ = self._campo(red, 8, \"Número máximo de épocas\", str(cfg[\"max_epocas\"]),", "                                       codigo=RedNeuronal.entrenar)", "        self.r_ecm, _ = self._campo(red, 9, \"ECM objetivo (se detiene al llegar)\", fmt(cfg[\"ecm_objetivo\"]),", "                                    codigo=RedNeuronal.entrenar)", "        self.r_tol, _ = self._campo(red, 10, \"Mejora mínima del ECM (vacío = no parar)\",", "                                    fmt(cfg[\"tolerancia\"]), codigo=RedNeuronal.entrenar)", "        self.r_pac, _ = self._campo(red, 11, \"   ... en cuántas épocas\", str(cfg[\"paciencia\"]),", "                                    codigo=RedNeuronal.entrenar)", "        self.r_sesgo = tk.BooleanVar(value=cfg[\"usar_sesgo\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Usar sesgo θ con entrada fija x0 =\",", "                                         variable=self.r_sesgo),", "                         RedNeuronal.__init__).grid(row=12, column=0, sticky=\"w\")", "        self.r_x0 = tk.StringVar(value=str(cfg[\"x0\"]))", "        self._ver_codigo(ttk.Combobox(red, textvariable=self.r_x0, values=(\"-1\", \"+1\"), state=\"readonly\",", "                                      width=4), suma_ponderada).grid(row=12, column=1, sticky=\"w\", padx=4)", "        self.r_normalizar = tk.BooleanVar(value=cfg[\"normalizar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Normalizar entradas y salida a [0, 1] (F16)\",", "                                         variable=self.r_normalizar),", "                         ex.ejecutar_regresion).grid(row=13, column=0, columnspan=2, sticky=\"w\")", "        self.r_barajar = tk.BooleanVar(value=cfg[\"barajar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Barajar los patrones (solo en el ajuste por patrón)\",", "                                         variable=self.r_barajar),", "                         ex.GeneradorAleatorio.barajar).grid(row=14, column=0, columnspan=2, sticky=\"w\")", "        self.r_semilla, _ = self._campo(red, 15, \"Semilla (vacía = aleatoria)\", \"\",", "                                        codigo=ex.GeneradorAleatorio.__init__)", "        self.r_registrar = tk.BooleanVar(value=cfg[\"registrar\"])", "        self._ver_codigo(ttk.Checkbutton(red, text=\"Registrar el proceso paso a paso; épocas:\",", "                                         variable=self.r_registrar),", "                         RedNeuronal._anotar_patron).grid(row=16, column=0, sticky=\"w\")", "        self.r_epocas_reg = tk.StringVar(value=str(cfg[\"epocas_registro\"]))", "        self._ver_codigo(ttk.Entry(red, textvariable=self.r_epocas_reg, width=5),", "                         RedNeuronal._anotar_patron).grid(row=16, column=1, sticky=\"w\", padx=4)", "        ttk.Label(red, style=\"Nota.TLabel\", justify=\"left\",", "                  text=\"La salida lineal no se satura: use tasas pequeñas (0,001 a 0,005 con el\\n\"", "                       \"ajuste por época). Las capas ocultas siguen siendo sigmoides.\").grid(", "            row=17, column=0, columnspan=2, sticky=\"w\", pady=(6, 0))", "        self.r_lbl_paso = self._ver_codigo(tk.Label(red, justify=\"left\", anchor=\"w\", wraplength=540,", "                                                    font=(\"Segoe UI\", 9, \"bold\"), bg=FONDO),", "                                           ex.guia_paso)", "        insertar_fila(red, 4)                 # justo debajo de la tasa de aprendizaje", "        self.r_lbl_paso.grid(row=4, column=0, columnspan=2, sticky=\"w\", pady=(0, 4))", "", "        acciones = ttk.Frame(f)", "        acciones.pack(fill=\"x\", pady=10)", "        boton = self._ver_codigo(", "            ttk.Button(acciones, text=\"▶  ENTRENAR REGRESIÓN\", style=\"Accion.TButton\",", "                       command=self.entrenar_regresion), ex.ejecutar_regresion)", "        boton.pack(side=\"left\", fill=\"x\", expand=True)", "        parar = self._ver_codigo(", "            ttk.Button(acciones, text=\"■ Detener\", command=self.detener_entrenamiento, state=\"disabled\"),", "            RedNeuronal.entrenar)", "        parar.pack(side=\"left\", padx=(6, 0), ipady=6)", "        self.botones_entrenar.append(boton)", "        self.botones_parar.append(parar)", "", "        prueba = ttk.LabelFrame(f, text=\"Predecir y para un punto nuevo (después de entrenar)\", padding=8)", "        prueba.pack(fill=\"x\", pady=4)", "        ttk.Label(prueba, text=\"x1; x2; ...\").pack(side=\"left\")", "        self.r_punto = tk.StringVar(value=fmt_vector([5] * ne))", "        self._ver_codigo(ttk.Entry(prueba, textvariable=self.r_punto, width=22),", "                         ex.prediccion).pack(side=\"left\", padx=6)", "        self._ver_codigo(ttk.Button(prueba, text=\"Predecir\", command=self.predecir_punto),", "                         ex.prediccion).pack(side=\"left\")", "", "        for var in (self.r_ocultas, self.r_nentradas):", "            var.trace_add(\"write\", lambda *a: self._actualizar_arquitectura_regresion())", "        for var in (self.r_modelo, self.r_coef, self.r_b, self.r_nentradas):", "            var.trace_add(\"write\", lambda *a: self._actualizar_formula())", "        self.r_tipo_momento.trace_add(\"write\", lambda *a: self._activar_momento_regresion())", "        for var in (self.r_tasa, self.r_n, self.r_ajuste, self.r_tipo_momento, self.r_alfa, self.r_salida):", "            var.trace_add(\"write\", lambda *a: self._actualizar_paso_regresion())", "        self._actualizar_arquitectura_regresion()", "        self._actualizar_formula()", "        self._activar_momento_regresion()", "        self._actualizar_paso_regresion()", "", "    def _actualizar_paso_regresion(self):", "        try:", "            tasa = float(self.r_tasa.get().replace(\",\", \".\"))", "            N = int(self.r_n.get())", "            alfa = float(self.r_alfa.get().replace(\",\", \".\"))", "        except ValueError:", "            self.r_lbl_paso.configure(text=\"\")", "            return", "        ajuste = \"patron\" if self.r_ajuste.get() == TEXTO_AJUSTE[\"patron\"] else \"epoca\"", "        tipo = \"clasico\" if self.r_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"] else \"profesor\"", "        lineal = self.r_salida.get() == TEXTO_SALIDA[\"lineal\"]", "        self._mostrar_paso(self.r_lbl_paso, *ex.guia_paso(tasa, N, ajuste, tipo, alfa, lineal))", "", "    def _escenario_regresion(self, nombre):", "        \"\"\"Carga un escenario de regresión que funciona bien. Usa el momento", "        clásico (con α = 0,9) porque el descenso por lotes con la fórmula del", "        profesor (momento 1) es muy lento en regresión, y la semilla 2 para que", "        el resultado se pueda repetir igual en la sustentación.\"\"\"", "        e = ESCENARIOS_REGRESION[nombre]", "        self.r_nentradas.set(str(e[\"entradas\"]))", "        self.r_modelo.set(e[\"modelo\"])", "        self.r_coef.set(fmt_vector(e[\"coef\"]))", "        self.r_centro.set(fmt_vector(e[\"centro\"]))", "        self.r_b.set(\"3\")", "        self.r_desv.set(\"2\")", "        self.r_dist.set(\"uniforme\")", "        self.r_ruido.set(fmt(e[\"ruido\"]))", "        self.r_dist_ruido.set(\"normal\")", "        self.r_n.set(\"200\")", "        self.r_ocultas.set(e[\"ocultas\"])", "        self.r_salida.set(TEXTO_SALIDA[\"lineal\"])", "        self.r_tasa.set(e[\"tasa\"])", "        self.r_ajuste.set(TEXTO_AJUSTE[\"epoca\"])", "        self.r_tipo_momento.set(TEXTO_MOMENTO[\"clasico\"])", "        self.r_alfa.set(\"0,9\")", "        self.r_epocas.set(e[\"epocas\"])", "        self.r_ecm.set(\"0\")", "        self.r_tol.set(\"0,0001\")", "        self.r_pac.set(e[\"paciencia\"])", "        self.r_normalizar.set(True)", "        self.r_semilla.set(\"2\")", "        self.r_punto.set(fmt_vector([5] * e[\"entradas\"]))", "        self.estado.configure(text=\"Escenario de regresión '%s' cargado (momento clásico, semilla 2): \"", "                                   \"presione ENTRENAR REGRESIÓN.\" % nombre)", "", "    def _n_entradas_regresion(self):", "        try:", "            return maximo([1, minimo([MAX_ENTRADAS, int(self.r_nentradas.get())])])", "        except ValueError:", "            return 2", "", "    def _cambio_entradas_regresion(self):", "        \"\"\"Ajusta las listas de medias y coeficientes al nuevo número de entradas:", "        conserva las que ya están y completa con valores por defecto.\"\"\"", "        n = self._n_entradas_regresion()", "        self.r_nentradas.set(str(n))", "        centros = leer_vector_seguro(self.r_centro.get())", "        coef = leer_vector_seguro(self.r_coef.get())", "        centros = (centros + [5.0] * MAX_ENTRADAS)[:n]", "        coef = (coef + COEFICIENTES_EXTRA[len(coef):])[:n]", "        self.r_centro.set(fmt_vector(centros))", "        self.r_coef.set(fmt_vector(coef))", "        self.r_punto.set(fmt_vector([5] * n))", "", "    def _actualizar_arquitectura_regresion(self):", "        try:", "            ocultas = leer_ocultas(self.r_ocultas.get())", "        except ValueError:", "            self.r_arquitectura.configure(text=\"Arquitectura: (revise las neuronas por capa)\")", "            return", "        capas = [self._n_entradas_regresion()] + ocultas + [1]", "        self.r_arquitectura.configure(text=\"Arquitectura: %s   (%d capa%s oculta%s, 1 salida)\" % (", "            \" → \".join(str(c) for c in capas), len(ocultas), \"\" if len(ocultas) == 1 else \"s\",", "            \"\" if len(ocultas) == 1 else \"s\"))", "", "    def _actualizar_formula(self):", "        try:", "            n = self._n_entradas_regresion()", "            cfg = {\"n_entradas\": n, \"modelo\": self.r_modelo.get(), \"sesgo\": leer_float(self.r_b, \"b\"),", "                   \"coeficientes\": leer_vector(self.r_coef.get(), \"Coeficientes\", n)}", "            self.r_formula.configure(text=\"Modelo real:  \" + ex.formula_modelo(cfg))", "        except (ValueError, KeyError):", "            self.r_formula.configure(text=\"Modelo real: (revise los coeficientes: uno por entrada)\")", "", "    def _activar_momento_regresion(self):", "        clasico = self.r_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"]", "        self.re_momento.configure(state=\"disabled\" if clasico else \"normal\")", "        self.re_alfa.configure(state=\"normal\" if clasico else \"disabled\")", "", "    def _config_regresion(self):", "        cfg = ex.config_regresion()", "        n = leer_int(self.r_nentradas, \"Entradas\", 1, MAX_ENTRADAS)", "        cfg[\"n_entradas\"] = n", "        cfg[\"n\"] = leer_int(self.r_n, \"Puntos\", 2, 10000)", "        cfg[\"modelo\"] = self.r_modelo.get()", "        cfg[\"coeficientes\"] = leer_vector(self.r_coef.get(), \"Coeficientes a\", n)", "        cfg[\"sesgo\"] = leer_float(self.r_b, \"Término independiente b\")", "        cfg[\"centro_x\"] = leer_vector(self.r_centro.get(), \"Media de las entradas\", n)", "        cfg[\"desviacion_x\"] = leer_positivo(self.r_desv, \"Desviación de las entradas\", cero=True)", "        cfg[\"distribucion_x\"] = self.r_dist.get()", "        cfg[\"desviacion_ruido\"] = leer_positivo(self.r_ruido, \"Desviación del ruido\", cero=True)", "        cfg[\"distribucion_ruido\"] = self.r_dist_ruido.get()", "        cfg[\"ocultas\"] = leer_ocultas(self.r_ocultas.get())", "        cfg[\"salida\"] = \"sigmoide\" if self.r_salida.get() == TEXTO_SALIDA[\"sigmoide\"] else \"lineal\"", "        cfg[\"tasa\"] = leer_positivo(self.r_tasa, \"Tasa de aprendizaje\")", "        cfg[\"ajuste\"] = \"patron\" if self.r_ajuste.get() == TEXTO_AJUSTE[\"patron\"] else \"epoca\"", "        cfg[\"tipo_momento\"] = \"clasico\" if self.r_tipo_momento.get() == TEXTO_MOMENTO[\"clasico\"] else \"profesor\"", "        cfg[\"momento\"] = leer_momento(self.r_momento, cfg[\"tipo_momento\"])", "        cfg[\"alfa\"] = leer_positivo(self.r_alfa, \"α del momento clásico\", cero=True)", "        if cfg[\"tipo_momento\"] == \"clasico\" and cfg[\"alfa\"] >= 1:", "            raise ValueError(\"α debe ser menor que 1: con α >= 1 los cambios se acumulan sin control.\")", "        cfg[\"max_epocas\"] = leer_int(self.r_epocas, \"Número máximo de épocas\", 1, 200000)", "        cfg[\"ecm_objetivo\"] = leer_positivo(self.r_ecm, \"ECM objetivo\", cero=True)", "        if self.r_tol.get().strip() == \"\":", "            cfg[\"tolerancia\"] = None", "        else:", "            cfg[\"tolerancia\"] = leer_positivo(self.r_tol, \"Mejora mínima del ECM\", cero=True)", "        cfg[\"paciencia\"] = leer_int(self.r_pac, \"Épocas para medir la mejora\", 1)", "        cfg[\"usar_sesgo\"] = self.r_sesgo.get()", "        cfg[\"x0\"] = int(self.r_x0.get())", "        cfg[\"normalizar\"] = self.r_normalizar.get()", "        cfg[\"barajar\"] = self.r_barajar.get()", "        cfg[\"semilla\"] = leer_semilla(self.r_semilla)", "        cfg[\"registrar\"] = self.r_registrar.get()", "        cfg[\"epocas_registro\"] = leer_int(self.r_epocas_reg, \"Épocas a registrar\", 1, 50)", "        return cfg", "", "    def entrenar_regresion(self):", "        if self.entrenando:", "            return", "        try:", "            cfg = self._config_regresion()", "        except ValueError as error:", "            messagebox.showerror(\"Dato no válido\", str(error))", "            self.estado.configure(text=\"Dato no válido: corrija el campo y vuelva a entrenar.\")", "            return", "        self._ejecutar(lambda progreso: ex.ejecutar_regresion(cfg, progreso))", "", "    def predecir_punto(self):", "        if self.res is None or self.res[\"tipo\"] != \"regresion\":", "            messagebox.showinfo(\"Primero entrene\", \"Entrene una regresión antes de predecir un punto.\")", "            return", "        n = len(self.res[\"X\"][0])", "        try:", "            x = leer_vector(self.r_punto.get(), \"Punto nuevo\", n)", "        except ValueError as error:", "            messagebox.showerror(\"Dato no válido\", str(error))", "            return", "        valor = ex.prediccion(self.res, x)", "        self.res[\"punto\"] = (x, valor)", "        self.pendientes.add(\"espacio\")", "        self.nb_res.select(0)", "        self._redibujar_visible()", "        cfg = self.res[\"config\"]", "        real = cfg[\"sesgo\"]", "        for a, xj in zip(cfg[\"coeficientes\"], x):", "            if cfg[\"modelo\"] == \"cuadratico\":", "                real += a * xj * xj", "            elif cfg[\"modelo\"] == \"senoidal\":", "                real += a * seno(xj)                                             # F27", "            else:", "                real += a * xj", "        self.estado.configure(text=\"Para x = (%s) la red predice y = %s   (modelo real sin ruido: %s)\"", "                              % (fmt_vector(x), num(valor), num(real)))", "", "    def _reiniciar_regresion(self):", "        cfg = ex.config_regresion()", "        ne = cfg[\"n_entradas\"]", "        self.r_nentradas.set(str(ne))", "        self.r_n.set(str(cfg[\"n\"]))", "        self.r_modelo.set(cfg[\"modelo\"])", "        self.r_coef.set(fmt_vector(cfg[\"coeficientes\"][:ne]))", "        self.r_b.set(fmt(cfg[\"sesgo\"]))", "        self.r_centro.set(fmt_vector(cfg[\"centro_x\"][:ne]))", "        self.r_desv.set(fmt(cfg[\"desviacion_x\"]))", "        self.r_dist.set(cfg[\"distribucion_x\"])", "        self.r_ruido.set(fmt(cfg[\"desviacion_ruido\"]))", "        self.r_dist_ruido.set(cfg[\"distribucion_ruido\"])", "        self.r_ocultas.set(\"; \".join(str(n) for n in cfg[\"ocultas\"]))", "        self.r_salida.set(TEXTO_SALIDA[cfg[\"salida\"]])", "        self.r_tasa.set(fmt(cfg[\"tasa\"]))", "        self.r_ajuste.set(TEXTO_AJUSTE[cfg[\"ajuste\"]])", "        self.r_tipo_momento.set(TEXTO_MOMENTO[cfg[\"tipo_momento\"]])", "        self.r_momento.set(fmt(cfg[\"momento\"]))", "        self.r_alfa.set(fmt(cfg[\"alfa\"]))", "        self.r_epocas.set(str(cfg[\"max_epocas\"]))", "        self.r_ecm.set(fmt(cfg[\"ecm_objetivo\"]))", " \"Tasa de aprendizaje = 0,3     Momento = 1     ajuste por época\\n\\n\"", "            \"Resultado esperado en la época 1 (sin sesgo):\\n\"", "            \"   Salidas y = 0,406   0,432   0,437   0,458\\n\"", "            \"   DeltaSalida = −0,098   0,139   0,139   −0,114\\n\"", "            \"   Pesos nuevos hacia la salida: −0,007   −0,886   0,154\\n\"", "            \"   Pesos nuevos de la capa oculta: −0,424  0,358  −0,743  −0,581  −0,961  −0,468\\n\")", "        ).pack(anchor=\"w\")", "        opciones = ttk.LabelFrame(f, text=\"Opciones\", padding=8)", "        opciones.pack(fill=\"x\", pady=4)", "        self.v_ej_sesgo = tk.BooleanVar(value=False)", "        self._ver_codigo(ttk.Radiobutton(opciones, text=\"Sin sesgo (exactamente como en las diapositivas)\",", "                                         value=False, variable=self.v_ej_sesgo),", "                         ex.ejecutar_ejemplo_clase).grid(row=0, column=0, columnspan=2, sticky=\"w\")", "        self._ver_codigo(ttk.Radiobutton(opciones, text=\"Con sesgo θ (inicial 0, x0 = −1)\",", "                                         value=True, variable=self.v_ej_sesgo),", "                         ex.ejecutar_ejemplo_clase).grid(row=1, column=0, columnspan=2, sticky=\"w\")", "        self.v_ej_epocas, _ = self._campo(opciones, 2, \"Número máximo de épocas\", \"3000\",", "                                          codigo=ex.ejecutar_ejemplo_clase)", "        self.v_ej_ecm, _ = self._campo(opciones, 3, \"ECM objetivo\", \"0,01\",", "                                       codigo=ex.ejecutar_ejemplo_clase)", "        ttk.Label(opciones, style=\"Nota.TLabel\", justify=\"left\", text=(", "            \"Sin sesgo, la entrada (0, 0) siempre da 0,5 en las neuronas ocultas y la red\\n\"", "            \"se queda en 75 % de exactitud. Con sesgo aprende el XOR completo.\")).grid(", "            row=4, column=0, columnspan=2, sticky=\"w\", pady=(6, 0))", "        self._ver_codigo(ttk.Button(f, text=\"▶  REPRODUCIR EJEMPLO\", style=\"Accion.TButton\",", "                                    command=self.reproducir_ejemplo),", "                         ex.ejecutar_ejemplo_clase).pack(fill=\"x\", pady=12)", "        ttk.Label(f, style=\"Nota.TLabel\", justify=\"left\", text=(", "            \"Después de reproducirlo: mueva la barra 'Época mostrada' a 1 y abra la\\n\"", "            \"pestaña Red para ver los pesos nuevos, o 'Proceso paso a paso' para ver\\n\"", "            \"las cuentas de cada patrón y del ajuste.\")).pack(anchor=\"w\")", "", "    # ------------------------------------------------------------------", "    # Barra de épocas (animación)", "    # ------------------------------------------------------------------", "    def _barra_epocas(self, padre):", "        self.estado = ttk.Label(padre, text=\"\", foreground=AZUL, font=(\"Segoe UI\", 10, \"bold\"),", "                                padding=(6, 0, 6, 4))", "        self.estado.pack(side=\"bottom\", fill=\"x\")", "        barra = ttk.Frame(padre, padding=(4, 6))", "        barra.pack(side=\"bottom\", fill=\"x\")", "        ttk.Label(barra, text=\"Época mostrada:\").pack(side=\"left\")", "        self.escala = tk.Scale(barra, from_=0, to=1, orient=\"horizontal\", resolution=1,", "                               showvalue=True, length=260, background=FONDO,", "                               highlightthickness=0, command=self._mover_epoca)", "        self.escala.pack(side=\"left\", padx=6)", "        self._ver_codigo(self.escala, RedNeuronal.pesos_en_epoca)", "        self._ver_codigo(ttk.Button(barra, text=\"▶ Animar entrenamiento\", command=self.animar),", "                         self._paso_animacion).pack(side=\"left\", padx=3)", "        self._ver_codigo(ttk.Button(barra, text=\"■ Detener\", command=self.detener),", "                         self.detener).pack(side=\"left\", padx=3)", "        self._ver_codigo(ttk.Button(barra, text=\"Resultado final\", command=self.mostrar_final),", "                         self.mostrar_final).pack(side=\"left\", padx=3)", "        self.estado.configure(text=\"Consejo: clic derecho sobre cualquier botón, campo, lista o pestaña \"", "                                   \"abre en VS Code la función que hace ese trabajo.\")", "", "    def _max_epocas(self):", "        return self.res[\"red\"].epocas", "", "    def _mover_epoca(self, valor):", "        if self.res is None:", "            return", "        nueva = int(float(valor))", "        if nueva >= self._max_epocas() and not self.animando:", "            nueva = None", "        if nueva == self.epoca:", "            return", "        self.epoca = nueva", "        self.pendientes = {clave for clave, _, _ in self.graficas}", "        self._redibujar_visible()", "", "    def animar(self):", "        if self.res is None or self.entrenando:", "            return", "        self.animando = True", "        self.escala.set(0)", "        self._paso_animacion(0)", "", "    def _paso_animacion(self, k):", "        \"\"\"Avanza la animación; con muchas épocas salta de a varias para que", "        dure unos 60 cuadros.\"\"\"", "        if not self.animando or self.res is None:", "            return", "        total = self._max_epocas()", "        self.escala.set(k)", "        self._mover_epoca(k)", "        self.raiz.update_idletasks()", "        if k < total:", "            salto = maximo([1, total // 60])", "            siguiente = k + salto if k + salto < total else total", "            self.raiz.after(60, lambda: self._paso_animacion(siguiente))", "        else:", "            self.animando = False", "", "    def detener(self):", "        self.animando = False", "", "    def mostrar_final(self):", "        self.animando = False", "        if self.res is None:", "            return", "        self.escala.set(self._max_epocas())", "        self.epoca = None", "        self.pendientes = {clave for clave, _, _ in self.graficas}", "        self._redibujar_visible()", "", "    # ------------------------------------------------------------------", "    # Reiniciar: valores por defecto y resultados en blanco", "    # ------------------------------------------------------------------", "    def reiniciar(self, preguntar=True):", "        if self.entrenando:", "            return", "        if preguntar and not messagebox.askyesno(", "                \"Reiniciar todo\",", "                \"Se borrarán los resultados y todos los parámetros volverán a sus \"", "                \"valores iniciales.\\n\\n¿Desea continuar?\"):", "            return", "        self.animando = False", "        cfg = ex.config_por_defecto()", "        self.v_tipo.set(cfg[\"tipo_datos\"])", "        self.v_nentradas.set(str(cfg[\"n_entradas\"]))", "        self.v_nclases.set(str(cfg[\"n_clases\"]))", "        self.v_npc.set(str(cfg[\"n_por_clase\"]))", "        self.filas_clase = [{\"centro\": tk.StringVar(value=fmt_vector(c[\"centro\"])),", "                             \"desv\": tk.StringVar(value=fmt(c[\"desviacion\"])),", "                             \"dist\": tk.StringVar(value=c[\"distribucion\"])} for c in cfg[\"clases\"]]", "        self.v_xor_desv.set(fmt(cfg[\"xor_desviacion\"]))", "        self.v_xor_lado.set(fmt(cfg[\"xor_lado\"]))", "        self.v_xor_dist.set(cfg[\"distribucion_xor\"])", "        self.v_esf_centro.set(fmt(cfg[\"esfera_centro\"]))", "        self.v_esf_r1.set(fmt(cfg[\"esfera_radio_interno\"]))", "        self.v_esf_r2.set(fmt(cfg[\"esfera_radio_externo\"]))", "        self.v_ocultas.set(\"; \".join(str(n) for n in cfg[\"ocultas\"]))", "        self.v_tasa.set(fmt(cfg[\"tasa\"]))", "        self.v_ajuste.set(TEXTO_AJUSTE[cfg[\"ajuste\"]])", "        self.v_tipo_momento.set(TEXTO_MOMENTO[cfg[\"tipo_momento\"]])", "        self.v_momento.set(fmt(cfg[\"momento\"]))", "        self.v_alfa.set(fmt(cfg[\"alfa\"]))", "        self.v_epocas.set(str(cfg[\"max_epocas\"]))", "        self.v_ecm.set(fmt(cfg[\"ecm_objetivo\"]))", "        self.v_sesgo.set(cfg[\"usar_sesgo\"])", "        self.v_x0.set(str(cfg[\"x0\"]))", "        self.v_normalizar.set(cfg[\"normalizar\"])", "        self.v_barajar.set(cfg[\"barajar\"])", "        self.v_semilla.set(\"\")", "        self.v_registrar.set(cfg[\"registrar\"])", "        self.v_epocas_reg.set(str(cfg[\"epocas_registro\"]))", "        self.v_punto.set(\"5; 5; 5\")", "        self.v_ej_sesgo.set(False)", "        self.v_ej_epocas.set(\"3000\")", "        self.v_ej_ecm.set(\"0,01\")", "        self._reiniciar_regresion()", "        self._construir_tabla()", "        self._cambio_tipo()", "        self._activar_momento()", "", "        self.res = None", "        self.epoca = None", "        self.pendientes = set()", "        for _, pestana, _ in self.graficas:", "            pestana.fig.clear()", "            pestana.barra.set_message(\"\")", "            pestana.canvas.draw_idle()", "        self.t_proceso.mostrar(\"\")", "        self.t_resumen.mostrar(\"Configure los datos y la red a la izquierda y presione ENTRENAR.\")", "        self.escala.configure(to=1)", "        self.escala.set(0)", "        self.estado.configure(text=\"Todo reiniciado: valores por defecto y sin resultados.\")", "        self.nb_config.select(0)", "        self.nb_res.select(0)", "", "    # ------------------------------------------------------------------", "    # Entrenamiento (en un hilo aparte para que la ventana no se congele)", "    # ------------------------------------------------------------------", "    def _progreso(self, epoca, total, ecm):", "        self.avance = (epoca, total, ecm)", "        return self.parar", "", "    def _ejecutar(self, funcion, despues=None):", "        \"\"\"funcion(progreso) entrena y devuelve el resultado. Corre en otro hilo;", "        aquí solo se revisa cada 150 ms cómo va.\"\"\"", "        if self.entrenando:", "            return", "        self.animando = False", "        self.entrenando = True", "        self.parar = False", "        self.avance = None", "        for boton in self.botones_entrenar:", "            boton.configure(state=\"disabled\")", "        for boton in self.botones_parar:", "            boton.configure(state=\"normal\")", "        self.raiz.configure(cursor=\"watch\")", "        resultado = {}", "", "        def trabajo():", "            try:", "                resultado[\"res\"] = funcion(self._progreso)", "            except Exception as error:          # se muestra en la ventana", "                resultado[\"error\"] = error", "", "        hilo = threading.Thread(target=trabajo, daemon=True)", "        hilo.start()", "", "        def revisar():", "            if hilo.is_alive():", "                if self.avance:", "                    ep, total, ecm = self.avance", "                    self.estado.configure(text=\"Entrenando... época %d de %d   ECM = %s\"", "                                          % (ep, total, num(ecm)))", "                else:", "                    self.estado.configure(text=\"Generando datos y entrenando...\")", "                self.raiz.after(150, revisar)", "                return", "            self.entrenando = False", "            for boton in self.botones_entrenar:", "                boton.configure(state=\"normal\")", "            for boton in self.botones_parar:", "                boton.configure(state=\"disabled\")", "            self.raiz.configure(cursor=\"\")", "            if \"error\" in resultado:", "                messagebox.showerror(\"Error\", str(resultado[\"error\"]))", "                self.estado.configure(text=\"No se pudo entrenar: \" + str(resultado[\"error\"]))", "                return", "            self._mostrar(resultado[\"res\"])", "            if despues:", "                despues()", "", "        self.raiz.after(150, revisar)", "", "    def detener_entrenamiento(self):", "        self.parar = True", "", "    def _mostrar(self, res):", "        self.res = res", "        self.epoca = None", "        self.escala.configure(to=maximo([self._max_epocas(),
