uncion": "media", "linea": 465, "fin": 470, "ini_funcion": 465, "fin_funcion": 470}}, {"codigo": "F23", "nombre": "Desviación estándar", "expr": "sigma = sqrt( (1/N) * sum((x - media)^2) )", "grupo": "Datos simulados", "ref": {"archivo": "formulas.py", "funcion": "desviacion_estandar", "linea": 473, "fin": 479, "ini_funcion": 473, "fin_funcion": 479}}, {"codigo": "M1", "nombre": "Valor absoluto", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "valor_absoluto", "linea": 60, "fin": 64, "ini_funcion": 60, "fin_funcion": 64}}, {"codigo": "M2", "nombre": "Raíz cuadrada (Newton-Raphson)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "raiz_cuadrada", "linea": 67, "fin": 81, "ini_funcion": 67, "fin_funcion": 81}}, {"codigo": "M3", "nombre": "Arcotangente (serie de Taylor)  ->  M4  pi (fórmula de Machin)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "arcotangente", "linea": 84, "fin": 100, "ini_funcion": 84, "fin_funcion": 100}}, {"codigo": "M5", "nombre": "Logaritmo natural (serie de atanh)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "logaritmo_natural", "linea": 126, "fin": 141, "ini_funcion": 126, "fin_funcion": 141}}, {"codigo": "M6", "nombre": "Coseno (serie de Taylor)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "coseno", "linea": 144, "fin": 162, "ini_funcion": 144, "fin_funcion": 162}}, {"codigo": "M7", "nombre": "Mínimo y máximo de una lista (recorrido simple)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "minimo", "linea": 165, "fin": 171, "ini_funcion": 165, "fin_funcion": 171}}, {"codigo": "M8", "nombre": "Número finito (ni infinito ni NaN)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "es_finito", "linea": 184, "fin": 189, "ini_funcion": 184, "fin_funcion": 189}}, {"codigo": "M9", "nombre": "Potencia entera (cuadrados sucesivos)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "potencia_entera", "linea": 192, "fin": 206, "ini_funcion": 192, "fin_funcion": 206}}, {"codigo": "M10", "nombre": "Exponencial e^x (reducción de rango + serie de Taylor)", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "exponencial", "linea": 216, "fin": 241, "ini_funcion": 216, "fin_funcion": 241}}, {"codigo": "M11", "nombre": "Redondeo al entero más cercano", "expr": "", "grupo": "Matemática básica", "ref": {"archivo": "formulas.py", "funcion": "redondear", "linea": 209, "fin": 213, "ini_funcion": 209, "fin_funcion": 213}}], "archivos_info": [{"archivo": "main.py", "capa": "Interfaz", "rol": "La ventana: pestañas, campos, botones, barra de épocas y clic derecho al código. No hace matemática: lee datos y llama a experimentos.", "usa": ["experimentos.py", "graficas.py", "red_neuronal.py", "aleatorio.py", "formulas.py"], "libs": "tkinter, matplotlib (solo para mostrar), threading, subprocess", "lineas": 1544, "funciones": 76}, {"archivo": "graficas.py", "capa": "Dibujo", "rol": "Todas las gráficas: espacio 2D/3D con frontera y superficie, errores, pesos por capa, todos los pesos, diagrama de la red, regresión. La superficie se calcula aquí con marching tetrahedra propio.", "usa": ["experimentos.py", "formulas.py"], "libs": "matplotlib (solo dibuja)", "lineas": 657, "funciones": 21}, {"archivo": "experimentos.py", "capa": "Orquestación", "rol": "Une las piezas: genera datos, normaliza, crea la red, entrena, calcula estadísticas, resumen, avisos y el mapa del código. También el ejemplo de clase y la regresión.", "usa": ["aleatorio.py", "red_neuronal.py", "formulas.py"], "libs": "copy (copiar la configuración)", "lineas": 474, "funciones": 20}, {"archivo": "red_neuronal.py", "capa": "Algoritmo", "rol": "La red multicapa: propagación, retropropagación, acumulación de G, ajuste, ciclo de épocas, criterios de parada e historial.", "usa": ["formulas.py"], "libs": "ninguna", "lineas": 454, "funciones": 31}, {"archivo": "aleatorio.py", "capa": "Datos", "rol": "Generador congruencial propio y los conjuntos de datos: nubes, XOR n-dimensional, esfera y regresión.", "usa": ["formulas.py"], "libs": "time (solo la semilla por defecto)", "lineas": 202, "funciones": 16}, {"archivo": "formulas.py", "capa": "Matemática", "rol": "F1–F27 y M1–M11 escritas a mano: exponencial, raíz, logaritmo, coseno, sigmoide, deltas, ajustes, errores, normalización, distribuciones.", "usa": [], "libs": "ninguna", "lineas": 479, "funciones": 41}], "numeros": [["Ejemplo de clase, patrón (0,0)", "y = 0,406 · DeltaS = −0,098"], ["Ejemplo: salidas de los 4 patrones", "0,406 · 0,432 · 0,437 · 0,458"], ["Ejemplo: G de la capa de salida", "0,03294 · 0,02192 · 0,02109"], ["Ejemplo: pesos de salida tras 1 época", "−0,007 · −0,886 · 0,154"], ["Ejemplo sin sesgo / con sesgo", "75 % / 100 % en 1778 épocas"], ["Nubes 3 clases (semilla 7)", "158 épocas, 100 %"], ["Clases cercanas / solapadas", "82 % / 55,7 %"], ["XOR 3D sin / con capa oculta (8)", "50 % / 100 %"], ["Esfera sin / con capa oculta (6)", "70,5 % / 100 %"], ["Tasa 0,01 / 0,05 / 0,1", "no llega / 353 / 158 épocas"], ["Tasa 0,3, 1 o 5", "33 % (saturada)"], ["Puntos por clase 20 / 100 / 300 / 600 (tasa 0,1)", "948 / 158 / 650 épocas / saturada"], ["Momento del profesor 0,99", "50 % (encoge los pesos)"], ["Momento clásico α = 0,5 / α = 0,9 con tasa 0,02", "1246 / 784 épocas"], ["Ajuste por patrón", "1389 épocas"], ["Regresión lineal / cuadrática / senoidal", "R² 0,9495 / 0,9994 / 0,948"], ["Regresión sin capa oculta", "R² 0,9638"], ["Regresión: fórmula del profesor / salida sigmoide", "R² 0,9723 / 0,979"]], "teoria": [{"id": "aprender", "titulo": "Qué es una red neuronal y cómo aprende", "bloques": [["p", "Una red neuronal artificial es una función con muchos parámetros ajustables, los **pesos**, que se organiza imitando de forma muy simplificada a las neuronas biológicas: cada unidad recibe señales, las pondera, las suma y decide cuánto se activa. Lo que la hace útil no es la forma de la función sino que sus pesos se pueden **ajustar a partir de ejemplos**, de manera que la red termina comportándose como la regla que generó esos ejemplos sin que nadie la haya escrito explícitamente."], ["p", "En este proyecto el aprendizaje es **supervisado**: cada patrón de entrenamiento trae sus entradas x y la salida deseada d, que en clasificación indica la clase y en regresión es el valor que se quiere predecir. La red calcula una salida y con sus pesos actuales, se compara con d para obtener el error, y ese error se usa para corregir los pesos en la dirección que lo hace más pequeño. Repetir esa corrección muchas veces sobre todo el conjunto de datos es lo que se llama entrenar."], ["p", "Todo el método se apoya entonces en tres piezas que se estudian en las lecciones siguientes: cómo calcula la red su salida (**propagación hacia adelante**), cómo se mide qué tan mal lo hizo (**función de error**) y cómo se reparte la culpa de ese error entre todos los pesos para corregirlos (**retropropagación con descenso por gradiente**)."], ["f", "datos (x, d)  →  red calcula y  →  error e = d − y  →  corrección de los pesos  →  se repite por épocas"]], "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 275, "fin": 275, "ini_funcion": 253, "fin_funcion": 351}], "pregunta": "¿Qué significa que el aprendizaje de su red sea supervisado?", "respuesta": "Que cada patrón trae la respuesta correcta d. La red compara su salida y con d, calcula el error e = d − y y con ese error ajusta los pesos. Sin d no habría error que propagar hacia atrás."}, {"id": "neurona", "titulo": "La neurona artificial", "bloques": [["p", "Una neurona hace dos cosas. Primero calcula la **suma ponderada** de sus entradas: cada entrada se multiplica por su peso, que indica cuánto influye y en qué sentido, y a eso se le suma el **sesgo** θ multiplicado por una entrada fija x0. Después pasa esa suma por una **función de activación**, que decide la salida de la neurona."], ["f", "S = w1·x1 + w2·x2 + … + wn·xn + θ·x0        (F1)\ny = f(S)"], ["p", "El sesgo cumple el papel de un umbral que la neurona también aprende. Como en la entrega 1, aquí se usa x0 = −1, de modo que la suma queda Σw·x − θ y la neurona se activa cuando la parte ponderada supera a θ. Geométricamente, sin sesgo la frontera de la neurona estaría obligada a pasar por el origen; con sesgo puede desplazarse a donde haga falta. Por eso, en el ejemplo de clase sin sesgo, el patrón (0, 0) produce S = 0 en todas las neuronas ocultas y la red no logra pasar del 75 %."], ["p", "La diferencia con el perceptrón de la entrega 1 está en f. Allá era un escalón, que solo dice 0 o 1 y no tiene derivada útil; aquí es la sigmoide, una curva suave que permite saber cuánto cambia la salida cuando cambia un peso, y esa es la condición para poder aplicar el descenso por gradiente."], ["w", "neurona"]], "refs": [{"archivo": "formulas.py", "funcion": "suma_ponderada", "linea": 247, "fin": 254, "ini_funcion": 247, "fin_funcion": 254}, {"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 55, "fin": 55, "ini_funcion": 44, "fin_funcion": 61}], "pregunta": "¿Para qué sirve el sesgo y por qué x0 = −1?", "respuesta": "El sesgo es un umbral aprendible: desplaza la frontera para que no tenga que pasar por el origen. Con x0 = −1 la suma queda Σwx − θ, así que θ funciona como el umbral que hay que superar. En el código es sesgos[c][j] y entra en suma_ponderada como theta * x0."}, {"id": "sigmoide", "titulo": "La sigmoide, su derivada y la saturación", "bloques": [["p", "La función de activación de las neuronas es la **sigmoide**, que lleva cualquier número real a un valor entre 0 y 1 con una forma de S: para sumas muy negativas da casi 0, para S = 0 da exactamente 0,5 y para sumas muy positivas da casi 1. Esa salida acotada se puede leer como un grado de activación o, en la salida, como la confianza en una clase."], ["f", "y = 1 / (1 + e^(−S))          (F2)\ny' = y · (1 − y)              (F3)"], ["p", "Su derivada tiene una propiedad muy conveniente: se puede escribir con la propia salida, y' = y(1 − y), así que durante la retropropagación no hay que volver a calcular ninguna exponencial, basta con la y que ya se guardó en la propagación. La derivada vale como máximo 0,25, cuando y = 0,5, y se hace cada vez más pequeña a medida que y se acerca a 0 o a 1."], ["p", "De ahí sale la **saturación**. Si la suma S de una neurona es muy grande en valor absoluto, por ejemplo por pesos que crecieron demasiado con una tasa alta, la salida queda pegada a 0 o a 1 y la derivada es prácticamente cero. Como todas las correcciones que llegan a esa neurona se multiplican por y', la neurona deja de aprender aunque el error sea grande. Con S = 5 la derivada ya es 0,0066 y con S = 10 es 0,000045. La red no falla con un error visible, simplemente se queda quieta, y en el simulador eso se nota porque la exactitud queda en el valor del azar."], ["w", "sigmoide"], ["p", "Como en este proyecto no se pueden usar librerías, la exponencial está programada a mano. Se escribe x = k·ln 2 + r con r pequeño, de modo que e^x = 2^k·e^r; e^r se calcula con la serie de Taylor y 2^k con multiplicaciones sucesivas. Además, para S negativo la sigmoide usa la forma equivalente e^S/(1 + e^S), con la que nunca se calcula la exponencial de un número grande."]], "refs": [{"archivo": "formulas.py", "funcion": "sigmoide", "linea": 257, "fin": 265, "ini_funcion": 257, "fin_funcion": 265}, {"archivo": "formulas.py", "funcion": "derivada_sigmoide", "linea": 268, "fin": 270, "ini_funcion": 268, "fin_funcion": 270}, {"archivo": "formulas.py", "funcion": "exponencial", "linea": 216, "fin": 241, "ini_funcion": 216, "fin_funcion": 241}], "pregunta": "¿Por qué una tasa muy grande puede hacer que la red deje de aprender?", "respuesta": "Porque los pesos crecen mucho, las sumas S se vuelven grandes y la sigmoide se satura: y queda en 0 o 1 y y' = y(1 − y) ≈ 0. Todos los deltas se multiplican por y', así que las correcciones se anulan. En el simulador, con tasa 0,3 o más y 100 puntos por clase la exactitud queda en 33 % (el azar con 3 clases)."}, {"id": "xor", "titulo": "Por qué hace falta una capa oculta: el XOR", "bloques": [["p", "Una sola neurona, igual que el perceptrón, separa el espacio con una recta en 2D o un plano en 3D: de un lado su salida es mayor que 0,5 y del otro menor. Eso basta para problemas **linealmente separables** como el AND, pero no para el **XOR**, donde (0,0) y (1,1) son de una clase y (0,1) y (1,0) de la otra. Las dos clases están en esquinas opuestas y ninguna recta deja a cada pareja de un solo lado; el mejor resultado posible con una recta es acertar tres de los cuatro puntos."], ["p", "La capa oculta resuelve esto porque **cada neurona oculta traza su propia frontera** y la neurona de salida combina esas fronteras. En el XOR, una neurona oculta puede activarse cuando x1 + x2 > 0,5 y otra cuando x1 + x2 > 1,5; la salida responde a «la primera sí pero la segunda no», que es justo la franja donde están (0,1) y (1,0). Visto de otra manera, la capa oculta transforma las entradas en un espacio nuevo en el que el problema sí es separable por la capa siguiente."], ["w", "xor"], ["p", "Ese es el salto central frente a la entrega 1, y el simulador lo muestra: el XOR en 3D da 50 % sin capa oculta y 100 % con 8 neuronas ocultas, y la esfera (una clase rodeada por otra) da 70,5 % sin capa oculta y 100 % con 6. Con suficientes neuronas ocultas, una red con una sola capa oculta puede aproximar cualquier frontera continua; ese resultado se conoce como teorema de aproximación universal."]], "refs": [{"archivo": "aleatorio.py", "funcion": "generar_xor", "linea": 104, "fin": 125, "ini_funcion": 104, "fin_funcion": 125}, {"archivo": "experimentos.py", "funcion": "ejecutar", "linea": 155, "fin": 155, "ini_funcion": 140, "fin_funcion": 179}], "pregunta": "¿Por qué un perceptrón no resuelve el XOR y una red con capa oculta sí?", "respuesta": "Porque el XOR no es linealmente separable: ninguna recta deja (0,0),(1,1) de un lado y (0,1),(1,0) del otro. En la red multicapa cada neurona oculta traza una frontera y la salida las combina, formando una franja que encierra a una de las clases."}, {"id": "capas", "titulo": "Capas, pesos e inicialización", "bloques": [["p", "Una red multicapa se describe por su **arquitectura**, la lista del número de neuronas en cada capa. Por ejemplo, [3, 5, 3] significa 3 entradas, una capa oculta de 5 neuronas y 3 salidas. La capa de entrada no calcula nada, solo entrega los valores x; cada capa siguiente está **totalmente conectada** a la anterior, de modo que cada neurona recibe todas las salidas de la capa previa."], ["p", "En el código los pesos se guardan como listas anidadas **pesos[c][j][i]**: c es la capa, j la neurona que recibe el peso e i la neurona (o entrada) de la que viene. Cada neurona tiene además su sesgo sesgos[c][j]. Como todos los cálculos recorren estas listas con ciclos que dependen de su longitud, el mismo código sirve para cualquier número de entradas, capas ocultas, neuronas y clases, sin ningún caso especial."], ["f", "pesos[c][j][i] = peso de la capa c que llega a la neurona j desde la neurona i de la capa anterior\nnúmero de pesos de la capa c = (neuronas de la capa c) × (neuronas de la capa anterior)"], ["p", "Los pesos se inician con valores **aleatorios** pequeños, en (−1, 1). Si todos empezaran iguales, todas las neuronas de una capa calcularían lo mismo, recibirían el mismo delta y se ajustarían igual, de modo que la capa entera se comportaría como una sola neurona; el azar rompe esa simetría. Que sean pequeños evita empezar con neuronas saturadas."]], "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.__init__", "linea": 89, "fin": 89, "ini_funcion": 66, "fin_funcion": 103}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.nombres_pesos", "linea": 369, "fin": 378, "ini_funcion": 369, "fin_funcion": 378}], "pregunta": "¿Por qué los pesos iniciales son aleatorios y no todos cero?", "respuesta": "Para romper la simetría. Con pesos iguales, todas las neuronas de una capa darían la misma salida, el mismo delta y el mismo ajuste, y la capa se comportaría como una sola neurona. Además se inician pequeños, en (−1, 1), para no arrancar con neuronas saturadas."}, {"id": "adelante", "titulo": "Propagación hacia adelante", "bloques": [["p", "Calcular la salida de la red para un patrón consiste en aplicar la regla de la neurona capa por capa. Las entradas x alimentan a la primera capa oculta; las salidas de esa capa se convierten en las entradas de la siguiente, y así hasta la capa de salida. Por eso se llama propagación hacia adelante: la información fluye en un solo sentido, sin ciclos."], ["f", "a[0] = x\na[c+1][j] = f( Σ_i pesos[c][j][i] · a[c][i] + θ[c][j] · x0 )\ny = a[última]"], ["p", "Un detalle importante es que se **guardan las salidas de todas las capas**, no solo la final. La retropropagación las necesita: la derivada de cada neurona se calcula con su salida y, y el gradiente de cada peso usa como factor la salida de la neurona de la que viene ese peso."], ["p", "Con los pesos del ejemplo de clase y el patrón (0, 1), las sumas de las neuronas ocultas son 0,358, −0,577 y −0,469, que tras la sigmoide dan 0,589, 0,360 y 0,385. La neurona de salida suma −0,017·0,589 − 0,893·0,360 + 0,148·0,385 = −0,275 y su salida es 0,432, el mismo valor de la diapositiva."]], "refs": [{"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 44, "fin": 61, "ini_funcion": 44, "fin_funcion": 61}], "pregunta": "¿Por qué propagar_con devuelve las salidas de todas las capas?", "respuesta": "Porque el backpropagation las usa: la derivada y' = y(1 − y) de cada neurona necesita su salida, y el gradiente de cada peso es entrada·delta, donde la entrada es la salida de la neurona anterior."}, {"id": "error", "titulo": "La función de error: E y ECM", "bloques": [["p", "Para corregir la red hace falta un número que diga qué tan lejos está de la respuesta correcta. Para cada salida se calcula el **error** e = d − y, y para todo el conjunto se usa la suma de los errores al cuadrado multiplicada por ½. Elevar al cuadrado hace que errores positivos y negativos no se cancelen y castiga más los errores grandes; el ½ está para que, al derivar, el 2 del cuadrado se simplifique."], ["f", "e = d − y                                (F4)\nE = ½ · Σ_patrones Σ_salidas e²           (F10)\nECM = Σ e² / (N · m)                      (F11)"], ["p", "E es la **función de costo** que el entrenamiento minimiza, y depende de todos los pesos de la red. El **error cuadrático medio** (ECM) es el mismo error promediado sobre los N patrones y las m salidas, y sirve para comparar redes o conjuntos de datos de distinto tamaño y para fijar un objetivo de parada que no dependa de cuántos puntos haya. En el simulador ambos se grafican época a época."], ["p", "El signo del error importa. Con e = d − y, si la red se quedó corta (y < d) el error es positivo y la corrección empuja la salida hacia arriba, y si se pasó, la empuja hacia abajo. Toda la regla de ajuste de clase está escrita para esa convención."]], "refs": [{"archivo": "formulas.py", "funcion": "error_salida", "linea": 273, "fin": 275, "ini_funcion": 273, "fin_funcion": 275}, {"archivo": "formulas.py", "funcion": "error_epoca", "linea": 316, "fin": 321, "ini_funcion": 316, "fin_funcion": 321}, {"archivo": "formulas.py", "funcion": "error_cuadratico_medio", "linea": 324, "fin": 330, "ini_funcion": 324, "fin_funcion": 330}], "pregunta": "¿Qué diferencia hay entre E y el ECM?", "respuesta": "E = ½Σe² es la función de costo que se deriva para obtener el gradiente; el ECM = Σe²/(N·m) es el promedio por patrón y salida, que permite comparar con distinto número de puntos o de salidas y fijar el ECM objetivo."}, {"id": "gradiente", "titulo": "Descenso por gradiente y tasa de aprendizaje", "bloques": [["p", "El error E se puede imaginar como una superficie sobre el espacio de todos los pesos: cada combinación de pesos tiene una altura, que es el error que produce. Entrenar es buscar el fondo de esa superficie. El **gradiente** es el vector de derivadas ∂E/∂w e indica la dirección en la que el error sube más rápido, así que basta con dar un paso en la dirección **contraria**."], ["f", "w(n+1) = w(n) − Tasa · ∂E/∂w\ncon e = d − y:   −∂E/∂w = Σ entrada · delta = G\n⇒  w(n+1) = w(n) + Tasa · G        (F8 con Momento = 1)"], ["p", "Esto explica la regla de clase. El producto entrada·delta es exactamente −∂E/∂w, así que **sumar** Tasa·G al peso equivale a bajar por la superficie del error; por eso la fórmula suma y no resta. Este signo se comprobó numéricamente comparando G con derivadas calculadas por diferencias finitas."], ["p", "La **tasa de aprendizaje** decide el tamaño del paso. Si es muy pequeña la red avanza lento y puede no llegar al objetivo en las épocas disponibles; si es muy grande el paso se pasa del fondo, oscila o diverge, y en una red con sigmoides lo más común es que los pesos crezcan hasta saturar las neuronas. Hay además una relación que conviene tener clara: con ajuste por lotes, G **suma** las contribuciones de los N patrones sin promediar, así que el paso efectivo es del orden de **Tasa × N**. Si se duplican los puntos con la misma tasa, el paso se duplica."], ["w", "descenso"], ["p", "En la gráfica, el error tiene la forma E = N·½(w − 2)², que se parece a lo que ve un peso cerca del mínimo. Cada paso multiplica la distancia al mínimo por (1 − Tasa·N). Si Tasa·N es menor que 1, la red se acerca sin pasarse; entre 1 y 2 oscila alrededor del mínimo pero converge; por encima de 2 diverge. Pruebe Tasa = 0,1 con N = 5 y luego con N = 30."]], "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}, {"archivo": "experimentos.py", "funcion": "guia_paso", "linea": 306, "fin": 306, "ini_funcion": 293, "fin_funcion": 317}], "pregunta": "Si su error es d − y, ¿por qué la fórmula suma Tasa·G en vez de restarla?", "respuesta": "Porque con e = d − y el producto entrada·delta es −∂E/∂w. Sumar Tasa·G es lo mismo que restar Tasa·∂E/∂w, o sea, dar un paso cuesta abajo en la superficie del error."}, {"id": "backprop", "titulo": "Retropropagación y regla de la cadena", "bloques": [["p", "El descenso por gradiente necesita ∂E/∂w para cada peso, incluidos los de las capas ocultas, que no tocan directamente el error. La **retropropagación** es la forma eficiente de calcular todas esas derivadas con la **regla de la cadena**: la derivada de una composición de funciones es el producto de las derivadas de cada eslabón. Para un peso de la capa de salida, que va de la neurona oculta j a la salida k, la cadena es corta."], ["f", "∂E/∂w_jk = ∂E/∂y_k · ∂y_k/∂S_k · ∂S_k/∂w_jk\n         = (−e_k) · y_k(1 − y_k) · h_j\n         = −δ_k · h_j\n\nδ_k = e_k · y_k(1 − y_k)          DeltaSalida = Error · Derivada   (F5)"], ["p", "La primera derivada sale de E = ½e² con e = d − y, la segunda es la derivada de la sigmoide y la tercera es la entrada que recibe ese peso, h_j, la salida de la neurona oculta. El producto de las dos primeras es el **delta de salida**. Para un peso de la capa oculta, que va de la entrada i a la neurona oculta j, la cadena pasa por la neurona j y luego por **todas** las salidas a las que j está conectada, porque cambiar h_j afecta a cada una de ellas."], ["f", "∂E/∂v_ij = Σ_k [ ∂E/∂y_k · ∂y_k/∂S_k · ∂S_k/∂h_j ] · ∂h_j/∂S_j · ∂S_j/∂v_ij\n         = Σ_k (−δ_k · w_jk) · h_j(1 − h_j) · x_i\n         = −δ_j · x_i\n\nδ_j = h_j(1 − h_j) · Σ_k w_jk · δ_k     DeltaCamada = Derivada · Σ peso · Delta   (F6)"], ["p", "El resultado tiene la misma forma en todas las capas: **el gradiente de un peso es la entrada que recibe por el delta de la neurona a la que llega**. Lo que cambia es cómo se obtiene el delta. En la salida sale del error; en una capa oculta sale de los deltas de la capa siguiente, ponderados por los pesos que las unen y multiplicados por la derivada de la propia neurona. Esa dependencia obliga a calcular primero los deltas de la salida y luego, capa por capa, los de las ocultas, **de atrás hacia adelante**; de ahí el nombre del método. Cuando la capa siguiente tiene una sola neurona, como en el XOR de clase, la suma tiene un solo término y queda la fórmula de la diapositiva, Derivada · peso · DeltaS."], ["p", "Dos detalles completan el cuadro. Los deltas de las capas ocultas se calculan con los pesos **anteriores** al ajuste, porque son los que produjeron el error. Y el sesgo se trata como un peso más cuya entrada es x0 = −1, de modo que su gradiente es δ·x0."], ["p", "En el ejemplo de clase, para el patrón (0,0) la salida es 0,406 con d = 0, el error es −0,406, la derivada 0,241 y DeltaSalida = −0,098. Para la neurona oculta 2, DeltaCamada = 0,25 · (−0,893) · (−0,098) = 0,022."]], "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 152, "fin": 172, "ini_funcion": 152, "fin_funcion": 172}, {"archivo": "formulas.py", "funcion": "delta_salida", "linea": 278, "fin": 280, "ini_funcion": 278, "fin_funcion": 280}, {"archivo": "formulas.py", "funcion": "delta_camada", "linea": 283, "fin": 292, "ini_funcion": 283, "fin_funcion": 292}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "linea": 179, "fin": 188, "ini_funcion": 179, "fin_funcion": 188}], "pregunta": "Explique de dónde sale la fórmula de DeltaCamada.", "respuesta": "De la regla de la cadena. El error depende de una neurona oculta a través de todas las neuronas de la capa siguiente; por cada una aparece su delta multiplicado por el peso que las une, y todo se multiplica por la derivada y(1 − y) de la neurona oculta. Por eso se calcula de atrás hacia adelante y con los pesos anteriores al ajuste."}, {"id": "epocas", "titulo": "Épocas: ajuste por lotes y por patrón", "bloques": [["p", "Una **época** es una pasada completa por todos los patrones de entrenamiento. Hay dos maneras de usar los gradientes dentro de ella. En el **ajuste por época, o por lotes**, que es el del ejemplo de clase y el que usa el simulador por defecto, todos los patrones se procesan con los mismos pesos, sus contribuciones entrada·delta se suman en G y al final de la época se hace **un solo ajuste**. En el **ajuste por patrón** se corrigen los pesos después de cada patrón, así que en una época hay N ajustes y cada patrón ve pesos un poco distintos."], ["f", "Lotes:   G = Σ_p entrada_p · delta_p   →   un ajuste por época\nPatrón:  un ajuste por cada patrón (en orden barajado)   →   N ajustes por época"], ["p", "El ajuste por lotes sigue el gradiente verdadero de E sobre todo el conjunto, por lo que la curva de error baja de forma suave y el resultado no depende del orden de los datos; a cambio, el paso es proporcional a Tasa × N y la tasa debe elegirse según el número de puntos. El ajuste por patrón avanza con muchos pasos pequeños y ruidosos; se barajan los patrones en cada época para que el orden no sesgue el aprendizaje."], ["p", "El entrenamiento termina por alguno de estos **criterios de parada**: el ECM alcanza el objetivo, se agotan las épocas, se detecta divergencia porque el error deja de ser un número o crece un millón de veces, el usuario pulsa Detener o, en regresión, el ECM deja de mejorar durante varias épocas. En cada época se guarda una copia de todos los pesos, y de ahí salen las gráficas de pesos y la barra que permite revisar cualquier época."]], "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 281, "fin": 281, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 339, "fin": 339, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 306, "fin": 306, "ini_funcion": 253, "fin_funcion": 351}], "pregunta": "¿Cuál es la diferencia entre ajustar por época y por patrón?", "respuesta": "Por época se suma G con todos los patrones usando los mismos pesos y se ajusta una vez al final; por patrón se ajusta después de cada patrón, con N ajustes por época y el orden barajado. Por época la curva es suave pero el paso crece con N."}, {"id": "momento", "titulo": "El momento", "bloques": [["p", "En la fórmula de clase el ajuste es Peso·Momento + Entrada·Delta·Tasa. Con Momento = 1 es el descenso por gradiente puro, que es el valor por defecto del simulador. Con un valor menor que 1, en cada época el peso se multiplica por ese número antes de sumar la corrección, lo que lo **encoge** hacia cero. Ese encogimiento compite con el gradiente y desplaza el punto de equilibrio lejos del mínimo del error; con Momento = 0,99 el XOR en 3D se queda en 50 %."], ["f", "Profesor (F8):   Peso(n+1) = Peso(n) · Momento + Tasa · G\nClásico  (F9):   ΔW(n) = Tasa · G + α · ΔW(n−1)\n                  Peso(n+1) = Peso(n) + ΔW(n)"], ["p", "En la literatura, momento suele referirse a otra idea, que el simulador ofrece como opción: el **momento clásico**. Aquí el cambio de cada época suma una fracción α del cambio anterior, como si el peso tuviera inercia. Cuando los gradientes apuntan varias veces en la misma dirección los cambios se acumulan y el avance se acelera; cuando alternan de signo se cancelan y la oscilación se amortigua. El paso efectivo crece aproximadamente como Tasa/(1 − α), así que con α = 0,9 conviene usar una tasa unas diez veces menor."], ["w", "momento"]], "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}, {"archivo": "formulas.py", "funcion": "ajuste_momento_clasico", "linea": 307, "fin": 313, "ini_funcion": 307, "fin_funcion": 313}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._aplicar", "linea": 190, "fin": 207, "ini_funcion": 190, "fin_funcion": 207}], "pregunta": "¿Qué pasa si pone el momento del profesor en 0,9?", "respuesta": "Cada época el peso se multiplica por 0,9 antes de sumar Tasa·G, así que se encoge hacia cero. El equilibrio queda lejos del mínimo del error y la red puede no aprender; por eso se deja en 1. El momento clásico es distinto: suma α veces el cambio anterior y acelera."}, {"id": "clases", "titulo": "Varias clases y superficie de separación", "bloques": [["p", "Con **dos clases** basta una neurona de salida: se entrena con d = 0 para una clase y d = 1 para la otra, y un punto se asigna a la segunda clase si y ≥ 0,5. Con **k clases** se usan k neuronas de salida con codificación **one-hot**: la salida deseada tiene un 1 en la neurona de su clase y 0 en las demás. Al clasificar gana la neurona con la salida más alta."], ["f", "3 clases:   clase 1 → d = (1, 0, 0)    clase 2 → d = (0, 1, 0)    clase 3 → d = (0, 0, 1)\nclase de la red = la neurona con mayor y          (F14)"], ["p", "La **superficie de separación** es el lugar donde la red no sabe por cuál clase decidirse. Con una salida es donde y = 0,5; con varias, la superficie entre las clases a y b es donde y_a = y_b y ambas son las dos salidas mayores. Como la red no tiene una ecuación cerrada de esa superficie, se encuentra numéricamente: se evalúa la red en una rejilla de puntos del espacio, se busca dónde cambia de signo la función F15 y se construyen triángulos en esos cortes con el algoritmo de marching tetrahedra. A diferencia del plano del perceptrón, esta superficie se puede curvar o cerrar sobre sí misma."], ["p", "Las clases no ocupan ejes. Los ejes x1, x2 y x3 son las **entradas**, y cada clase es un color de puntos dentro de ese espacio; por eso en 3D se pueden dibujar todas las clases que se quiera. Lo que impide dibujar el espacio es tener más de 3 entradas. En ese caso el simulador muestra el error, el ECM, los pesos y el diagrama de la red."]], "refs": [{"archivo": "experimentos.py", "funcion": "salidas_deseadas", "linea": 113, "fin": 119, "ini_funcion": 113, "fin_funcion": 119}, {"archivo": "formulas.py", "funcion": "clase_de_la_salida", "linea": 356, "fin": 366, "ini_funcion": 356, "fin_funcion": 366}, {"archivo": "formulas.py", "funcion": "funcion_frontera", "linea": 369, "fin": 377, "ini_funcion": 369, "fin_funcion": 377}, {"archivo": "graficas.py", "funcion": "triangulos_superficie", "linea": 132, "fin": 173, "ini_funcion": 132, "fin_funcion": 173}], "pregunta": "¿Cuántas neuronas de salida usa con 4 clases y cómo decide la clase?", "respuesta": "Cuatro, con codificación one-hot: la salida deseada tiene 1 en la neurona de su clase y 0 en las demás. La clase es la neurona con la salida más alta (F14). Solo con 2 clases se usa una única salida con umbral 0,5."}, {"id": "regresion", "titulo": "Regresión con la misma red", "bloques": [["p", "En regresión la salida deseada es un número real, no una clase. Se usa la misma red con una única neurona de salida, que puede ser **lineal**, con y = S, para que su salida no quede limitada a (0, 1). Su derivada es 1, así que el delta de salida es simplemente el error, y la retropropagación hacia las capas ocultas no cambia. La otra opción es mantener la sigmoide en la salida y normalizar la salida deseada a [0, 1]."], ["f", "salida lineal:   y = S,  y' = 1   ⇒   DeltaSalida = e        (F24, F25)\nR² = 1 − Σ(d − y)² / Σ(d − media)²                          (F26)"], ["p", "Las curvas las aportan las **neuronas ocultas**. Cada sigmoide oculta es un escalón suave y la salida lineal suma esos escalones con distintos pesos, así que con suficientes neuronas la red puede seguir una parábola o una senoide. Sin capa oculta, la red con salida lineal solo puede ajustar un plano, igual que el perceptrón de la entrega 1."], ["p", "La calidad del ajuste se mide con el **coeficiente de determinación R²**, que compara el error de la red con el de predecir siempre la media: 1 es un ajuste perfecto y 0 no mejora a la media. Como la salida lineal no está acotada, sus gradientes pueden ser grandes y conviene usar tasas pequeñas, entre 0,001 y 0,005. En el simulador el modelo cuadrático llega a R² = 0,9994 y el senoidal a 0,948."]], "refs": [{"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 56, "fin": 56, "ini_funcion": 44, "fin_funcion": 61}, {"archivo": "formulas.py", "funcion": "delta_salida_lineal", "linea": 392, "fin": 394, "ini_funcion": 392, "fin_funcion": 394}, {"archivo": "formulas.py", "funcion": "coeficiente_determinacion", "linea": 397, "fin": 410, "ini_funcion": 397, "fin_funcion": 410}, {"archivo": "experimentos.py", "funcion": "ejecutar_regresion", "linea": 208, "fin": 247, "ini_funcion": 208, "fin_funcion": 247}], "pregunta": "Si la salida es lineal, ¿cómo puede la red ajustar una parábola?", "respuesta": "Porque las neuronas ocultas siguen siendo sigmoides: cada una aporta un escalón suave y la salida lineal los suma con pesos distintos, lo que permite formar curvas. Sin capa oculta solo se ajustaría un plano."}, {"id": "normalizacion", "titulo": "Normalización de las entradas", "bloques": [["p", "La sigmoide solo aprende bien cuando las sumas S están en una zona moderada, más o menos entre −4 y 4, donde su derivada no es despreciable. Si las entradas toman valores grandes, las sumas también lo son desde el principio. Con tres entradas cercanas a 10 y pesos de 0,8, la suma puede llegar a 24; la derivada vale entonces 3,8·10⁻¹¹ y la neurona nace saturada. Con las mismas entradas llevadas a [0, 1], la suma es como mucho 2,4 y la derivada 0,076."], ["f", "x' = (x − mín) / (máx − mín)          (F16)\ndesnormalizar:  x = x' · (máx − mín) + mín"], ["p", "Por eso cada entrada se normaliza con su mínimo y su máximo antes de entrenar, y en regresión también la salida deseada. Las gráficas se dibujan en las unidades originales: cuando hace falta evaluar la red en un punto del espacio, ese punto se normaliza con los mismos mínimos y máximos antes de pasarlo a la red. Normalizar también hace que todas las entradas pesen de forma comparable al comienzo, aunque estén medidas en escalas distintas."]], "refs": [{"archivo": "formulas.py", "funcion": "normalizar", "linea": 418, "fin": 423, "ini_funcion": 418, "fin_funcion": 423}, {"archivo": "experimentos.py", "funcion": "ejecutar", "linea": 148, "fin": 148, "ini_funcion": 140, "fin_funcion": 179}, {"archivo": "experimentos.py", "funcion": "entrada_de_la_red", "linea": 277, "fin": 281, "ini_funcion": 277, "fin_funcion": 281}], "pregunta": "¿Por qué normaliza las entradas?", "respuesta": "Porque con entradas grandes las sumas S crecen, la sigmoide se satura y su derivada se acerca a cero, así que la red no aprende. Llevarlas a [0, 1] mantiene S en la zona donde la derivada es útil. Las gráficas se muestran en unidades originales."}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('datos').textContent);

/* ---------- resaltado de Python hecho a mano ---------- */
const KW = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const BI = new Set('len range list tuple dict set int float str print enumerate zip isinstance getattr abs sorted reversed super object any all type open round bool hasattr setattr iter next'.split(' '));
function resaltar(lineas){
  const out = []; let triple = null;
  const re = /(#.*$)|("""|''')|([rRbBfFuU]{0,2}"(?:[^"\\]|\\.)*"|[rRbBfFuU]{0,2}'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?(?:[eE][-+]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^\s])/y;
  for (const linea of lineas){
    let h = '', i = 0, defSig = false;
    if (triple){
      const j = linea.indexOf(triple);
      if (j < 0){ out.push('<span class="tk-s">'+esc(linea)+'</span>'); continue; }
      h += '<span class="tk-s">'+esc(linea.slice(0,j+3))+'</span>'; i = j+3; triple = null;
    }
    re.lastIndex = i;
    while (re.lastIndex < linea.length){
      const m = re.exec(linea); if (!m) break;
      if (m[1]) h += '<span class="tk-c">'+esc(m[1])+'</span>';
      else if (m[2]){
        const ini = re.lastIndex; const j = linea.indexOf(m[2], ini);
        if (j < 0){ h += '<span class="tk-s">'+esc(linea.slice(ini-3))+'</span>'; triple = m[2]; break; }
        h += '<span class="tk-s">'+esc(linea.slice(ini-3, j+3))+'</span>'; re.lastIndex = j+3;
      }
      else if (m[3]) h += '<span class="tk-s">'+esc(m[3])+'</span>';
      else if (m[4]) h += '<span class="tk-n">'+m[4]+'</span>';
      else if (m[5]){
        const w = m[5];
        if (defSig){ h += '<span class="tk-f">'+w+'</span>'; defSig = false; }
        else if (KW.has(w)){ h += '<span class="tk-k">'+w+'</span>'; if (w==='def'||w==='class') defSig = true; }
        else if (w === 'self') h += '<span class="tk-self">self</span>';
        else if (BI.has(w)) h += '<span class="tk-b">'+w+'</span>';
        else h += w;
      }
      else h += esc(m[6] || m[7]);
    }
    out.push(h);
  }
  return out;
}
const HL = {};
function hl(a){ return HL[a] || (HL[a] = resaltar(D.archivos[a])); }

/* ---------- utilidades de referencias ---------- */
const corto = q => q.replace(/^Aplicacion\./,'Aplicacion.').replace(/^RedNeuronal\./,'RedNeuronal.');
function textoLinea(a, l){ return (D.archivos[a][l-1] || '').trim(); }
function refBtn(r, conLinea){
  const etiqueta = esc(r.archivo)+' › '+esc(r.funcion)+' <span class="ln">L'+r.linea+(r.fin && r.fin!==r.linea ? '–'+r.fin : '')+'</span>';
  const b = '<button class="ref" data-ref=\''+esc(JSON.stringify([r.archivo,r.funcion,r.linea,r.fin||r.linea]))+'\'>'+etiqueta+'</button>';
  if (!conLinea) return b;
  return '<div class="ref-bloque">'+b+'<div class="ref-linea">'+esc(textoLinea(r.archivo, r.linea))+'</div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ref]'); if (!b) return;
  const [a,f,l,fin] = JSON.parse(b.dataset.ref);
  abrirCodigo(a, f, l, fin);
});
function claveDe(a, f){ return a+'::'+f; }
function funcionEn(a, l){
  let mejor = null;
  for (const k in D.indice){ if (!k.startsWith(a+'::')) continue; const v = D.indice[k];
    if (l >= v.ini && l <= v.fin && (!mejor || v.fin - v.ini < D.indice[mejor].fin - D.indice[mejor].ini)) mejor = k; }
  return mejor;
}
function snippet(a, ini, fin, foco1, foco2, atras){
  const L = hl(a); let h = '<div class="snip'+(atras?' atras':'')+'">';
  for (let l = ini; l <= fin; l++) h += '<div class="fila'+(l>=foco1 && l<=foco2?' foco':'')+'"><span class="num">'+l+'</span><span class="src">'+(L[l-1]||' ')+'</span></div>';
  return h + '</div>';
}
function centrarSnip(cont){ const f = cont.querySelector('.snip .foco'); const s = cont.querySelector('.snip'); if (f && s) s.scrollTop = Math.max(0, f.offsetTop - s.clientHeight/3); }

   EXPLORADOR DE CÓDIGO

let EX = {archivo:'red_neuronal.py', clave:'red_neuronal.py::RedNeuronal.retropropagar', foco:null, focoFin:null, nota:null};
function abrirCodigo(a, f, l, fin){
  EX.archivo = a;
  EX.clave = f ? claveDe(a, f) : (Object.keys(D.anotaciones).find(k => k.startsWith(a+'::')) || null);
  if (EX.clave && !D.indice[EX.clave]) EX.clave = l ? funcionEn(a, l) : null;
  EX.foco = l || null; EX.focoFin = fin || l || null; EX.nota = null;
  if (vistaActual === 'codigo') pintarExplorador(); else ir('codigo');
}
RENDER.codigo = cont => {
  cont.innerHTML = `
  <section class="vista">
    <div class="cab"><span class="eyebrow">Explorador</span><h2>El código, con las líneas que más le van a preguntar</h2>
      <p class="lede">El punto naranja marca una línea explicada: tóquela para leer qué hace. La banda azul es la función elegida. Los números de línea son los del repositorio, los mismos que abre el clic derecho del simulador.</p></div>
    <div class="ex-barra">
      <div class="pestanas" id="ex-pest">${ARCH.map(a => '<button data-a="'+a+'">'+a+'</button>').join('')}</div>
      <div class="buscar"><input id="ex-buscar" type="search" placeholder="Buscar función: delta, sigmoide, entrenar…" autocomplete="off" aria-label="Buscar función"><div class="resultados" id="ex-res" hidden></div></div>
    </div>
    <select class="sel-movil" id="ex-sel" aria-label="Función"></select>
    <div class="explorador">
      <div class="lista-fn" id="ex-lista"></div>
      <div class="codigo" id="ex-codigo"></div>
      <aside class="ficha" id="ex-ficha"></aside>
    </div>
  </section>`;
  $('#ex-pest').onclick = e => { const b = e.target.closest('button'); if (b) { EX.archivo = b.dataset.a; EX.clave = null; EX.foco = null; EX.nota = null; pintarExplorador(); $('#ex-codigo').scrollTop = 0; } };
  const inp = $('#ex-buscar'), res = $('#ex-res');
  let sel = 0, hits = [];
  const pint = () => { res.innerHTML = hits.map((k,i) => { const [a,q] = k.split('::'); return '<button class="'+(i===sel?'act':'')+'" data-k="'+esc(k)+'">'+esc(q)+' <small>'+a+' · L'+D.indice[k].ini+(D.anotaciones[k]?' · explicada':'')+'</small></button>'; }).join(''); res.hidden = !hits.length; };
  inp.oninput = () => {
    const t = inp.value.trim().toLowerCase(); sel = 0;
    if (!t){ hits = []; pint(); return; }
    hits = Object.keys(D.indice).filter(k => k.toLowerCase().includes(t) || (D.indice[k].doc||'').toLowerCase().includes(t))
      .sort((x,y) => (D.anotaciones[y]?1:0) - (D.anotaciones[x]?1:0)).slice(0, 30);
    pint();
  };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown'){ sel = Math.min(sel+1, hits.length-1); pint(); e.preventDefault(); }
    if (e.key === 'ArrowUp'){ sel = Math.max(sel-1, 0); pint(); e.preventDefault(); }
    if (e.key === 'Enter' && hits[sel]){ elegir(hits[sel]); }
    if (e.key === 'Escape'){ hits = []; pint(); }
  };
  const elegir = k => { const [a,q] = k.split('::'); hits = []; pint(); inp.value = ''; abrirCodigo(a, q); };
  res.onclick = e => { const b = e.target.closest('[data-k]'); if (b) elegir(b.dataset.k); };
  inp.addEventListener('blur', () => setTimeout(() => { hits = []; pint(); }, 180));
  $('#ex-sel').onchange = e => abrirCodigo(EX.archivo, e.target.value.split('::')[1]);
  pintarExplorador();
};
function pintarExplorador(){
  const a = EX.archivo;
  document.querySelectorAll('#ex-pest button').forEach(b => b.setAttribute('aria-pressed', b.dataset.a===a));
  const claves = Object.keys(D.indice).filter(k => k.startsWith(a+'::')).sort((x,y) => D.indice[x].ini - D.indice[y].ini);
  if (!EX.clave || !EX.clave.startsWith(a+'::')) EX.clave = claves.find(k => D.anotaciones[k]) || claves[0];
  // lista
  let h = '', clase = null;
  for (const k of claves){
    const q = k.split('::')[1]; const v = D.indice[k];
    if (!q.includes('.') && /^[A-Z]/.test(q)) { h += '<div class="clase">clase '+esc(q)+'</div>'; clase = q; continue; }
    if (clase && !q.startsWith(clase+'.')) { h += '<div class="clase">funciones</div>'; clase = null; }
    const nombre = q.includes('.') ? q.split('.').pop() : q;
    h += '<button data-k="'+esc(k)+'" class="'+(k===EX.clave?'act ':'')+(D.anotaciones[k]?'anotada ':'')+(P.vistas[k]?'vista':'')+'" title="'+esc(q)+' — '+esc(v.doc||'')+'"><span class="n">'+esc(nombre)+'</span><span class="l">'+v.ini+'</span></button>';
  }
  const lista = $('#ex-lista'); lista.innerHTML = h;
  lista.onclick = e => { const b = e.target.closest('[data-k]'); if (b) { EX.clave = b.dataset.k; EX.foco = null; EX.nota = null; pintarExplorador(); } };
  $('#ex-sel').innerHTML = claves.filter(k => k.split('::')[1].includes('.') || !/^[A-Z]/.test(k.split('::')[1])).map(k => '<option value="'+esc(k)+'"'+(k===EX.clave?' selected':'')+'>'+esc(k.split('::')[1])+' · L'+D.indice[k].ini+(D.anotaciones[k]?' ●':'')+'</option>').join('');
  // código
  const L = hl(a), fuente = D.archivos[a];
  const v = D.indice[EX.clave] || {ini:0, fin:-1};
  const an = D.anotaciones[EX.clave];
  const notas = {}; if (an) an.lineas.forEach(n => notas[n.linea] = n.nota);
  // notas de todas las funciones del archivo (punto naranja en cualquier lugar)
  const todas = {};
  for (const k in D.anotaciones) if (k.startsWith(a+'::')) D.anotaciones[k].lineas.forEach(n => todas[n.linea] = k);
  const f1 = EX.foco || 0, f2 = EX.focoFin || EX.foco || 0;
  let c = '';
  const n = fuente[fuente.length-1] === '' ? fuente.length-1 : fuente.length;
  for (let l = 1; l <= n; l++){
    let cls = 'fila';
    if (l >= v.ini && l <= v.fin) cls += ' rango';
    if (f1 && l >= f1 && l <= f2) cls += ' foco';
    if (todas[l]) cls += ' nota';
    if (EX.nota === l) cls += ' nota-act';
    c += '<div class="'+cls+'" data-l="'+l+'"><span class="num">'+l+'</span><span class="mk"></span><span class="src">'+(L[l-1]||' ')+'</span></div>';
  }
  const cod = $('#ex-codigo'); cod.innerHTML = c;
  cod.onclick = e => {
    const fila = e.target.closest('.fila'); if (!fila) return;
    const l = +fila.dataset.l;
    if (!fila.classList.contains('nota') && !e.target.classList.contains('num')) return;
    const k = todas[l] || funcionEn(a, l);
    if (k !== EX.clave){ EX.clave = k; EX.foco = null; }
    EX.nota = todas[l] ? l : null; if (!todas[l]) { EX.foco = l; EX.focoFin = l; }
    pintarExplorador(true);
  };
  if (!arguments[0]){
    const destino = f1 || v.ini;
    const fila = cod.querySelector('[data-l="'+destino+'"]');
    if (fila) cod.scrollTop = Math.max(0, fila.offsetTop - (f1 ? cod.clientHeight/3 : 24));
  }
  pintarFicha();
  const act = $('#ex-lista .act'); if (act && !arguments[0]) { const li = $('#ex-lista'); li.scrollTop = Math.max(0, act.offsetTop - li.clientHeight/3); }
}
function pintarFicha(){
  const k = EX.clave, f = $('#ex-ficha');
  if (!k || !D.indice[k]){ f.innerHTML = '<p class="lede">Elija una función.</p>'; return; }
  const [a, q] = k.split('::'); const v = D.indice[k]; const an = D.anotaciones[k];
  const conc = Object.fromEntries(D.conceptos.map(c => [c.id, c]));
  const form = Object.fromEntries(D.formulas.map(x => [x.codigo, x]));
  const enlaces = (lst) => lst.length ? lst.map(x => { const [aa, qq] = x.split('::'); return '<button class="chip f" data-ir="'+esc(x)+'">'+esc(qq)+(aa!==a?' <span style="color:var(--muted)">('+aa.replace('.py','')+')</span>':'')+'</button>'; }).join('') : '<span class="lede" style="font-size:.82rem">ninguna del proyecto</span>';
  let h = '<div><div class="donde">'+a+' · líneas '+v.ini+'–'+v.fin+'</div><h3>'+esc(q)+'</h3></div>';
  if (an) h += '<p class="que">'+esc(an.que)+'</p>';
  else if (v.doc) h += '<p class="que">'+esc(v.doc)+'</p>';
  h += '<div class="vscode">En VS Code: <kbd>Ctrl</kbd>+<kbd>P</kbd> → <code>'+a+'</code>, luego <kbd>Ctrl</kbd>+<kbd>G</kbd> → <code>'+(EX.nota || EX.foco || v.ini)+'</code>. En el simulador: clic derecho sobre el control.</div>';
  if (an && an.lineas.length){
    h += '<div><div class="sub">Línea por línea</div><ul class="notas">'+an.lineas.map(n => '<li><button data-nl="'+n.linea+'" class="'+(EX.nota===n.linea?'act':'')+'"><span class="l">L'+n.linea+'</span><span>'+esc(n.nota)+'</span></button></li>').join('')+'</ul></div>';
  }
  if (an && an.formulas.length) h += '<div><div class="sub">Fórmulas</div><div class="chips">'+an.formulas.map(c => '<button class="chip f" data-form="'+c+'">'+c+'</button>').join('')+'</div><div id="ex-form"></div></div>';
  if (an && an.conceptos.length) h += '<div><div class="sub">Conceptos</div><div class="chips">'+an.conceptos.filter(c => conc[c]).map(c => '<button class="chip" data-conc="'+c+'">'+esc(conc[c].nombre)+'</button>').join('')+'</div></div>';
  h += '<div><div class="sub">Llama a</div><div class="chips">'+enlaces(v.llama||[])+'</div></div>';
  h += '<div><div class="sub">La llaman desde</div><div class="chips">'+enlaces(v.llamada_por||[])+'</div></div>';
  if (an) h += '<div class="fila-btn"><button class="btn'+(P.vistas[k]?'':' pri')+'" id="ex-marcar">'+(P.vistas[k]?'✓ Estudiada':'Marcar como estudiada')+'</button></div>';
  const lista = Object.keys(D.anotaciones); const i = lista.indexOf(k);
  if (i >= 0) h += '<div class="fila-btn"><button class="btn" id="ex-ant"'+(i===0?' disabled':'')+'>← Anterior explicada</button><button class="btn" id="ex-sig"'+(i===lista.length-1?' disabled':'')+'>Siguiente explicada →</button></div>';
  f.innerHTML = h; f.scrollTop = 0;
  f.querySelectorAll('[data-nl]').forEach(b => b.onclick = () => { EX.nota = +b.dataset.nl; EX.foco = null; pintarExplorador(true); const fila = $('#ex-codigo [data-l="'+EX.nota+'"]'); const cod = $('#ex-codigo'); if (fila) cod.scrollTop = Math.max(0, fila.offsetTop - cod.clientHeight/3); });
  f.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { const [aa, qq] = b.dataset.ir.split('::'); abrirCodigo(aa, qq); });
  f.querySelectorAll('[data-conc]').forEach(b => b.onclick = () => { CONC_FOCO = b.dataset.conc; ir('conceptos'); });
  f.querySelectorAll('[data-form]').forEach(b => b.onclick = () => { const x = form[b.dataset.form]; $('#ex-form').innerHTML = x ? '<div class="formula-pop" style="margin-top:8px"><b>'+x.codigo+'</b> '+esc(x.nombre)+(x.expr?'<br>'+esc(x.expr):'')+'</div>' : ''; });
  const m = $('#ex-marcar'); if (m) m.onclick = () => { if (P.vistas[k]) delete P.vistas[k]; else P.vistas[k] = 1; guardar(); pintarExplorador(true); };
  const ant = $('#ex-ant'), sig = $('#ex-sig');
  const salto = kk => { const [aa, qq] = kk.split('::'); abrirCodigo(aa, qq); };
  if (ant) ant.onclick = () => salto(lista[i-1]);
  if (sig) sig.onclick = () => salto(lista[i+1]);
}

function descenso(el, cfg){
  const conMom = !!cfg.momento;
  const TASAS = [0.001,0.002,0.005,0.01,0.02,0.03,0.05,0.07,0.1,0.15,0.2,0.3,0.5];
  const it = TASAS.indexOf(cfg.tasa);
  el.innerHTML = '<span class="w-tit">'+(conMom?'Momento del profesor y momento clásico':'Bajar por la curva del error')+'</span><div id="'+cfg.id+'-g"></div><div class="controles">'+
    control(cfg.id+'-t','Tasa',0,TASAS.length-1,1,it)+control(cfg.id+'-n','Patrones N (lotes)',1,60,1,cfg.N)+
    (conMom ? control(cfg.id+'-a','α del momento clásico',0,0.95,0.05,0)+control(cfg.id+'-m','Momento del profesor',0.8,1,0.01,1) : '')+
    '</div><div class="lectura" id="'+cfg.id+'-o"></div>';
  const W = 560, H = 250, x0 = 40, x1 = W-14, y0 = 14, y1 = H-30, wmin = -4, wmax = 8, emax = 18;
  const X = w => x0 + (w-wmin)/(wmax-wmin)*(x1-x0), Y = e => y1 - Math.min(e, emax*1.05)/emax*(y1-y0);
  const act = () => {
    const tasa = TASAS[+$('#'+cfg.id+'-t').value], N = +$('#'+cfg.id+'-n').value;
    const alfa = conMom ? +$('#'+cfg.id+'-a').value : 0, m = conMom ? +$('#'+cfg.id+'-m').value : 1;
    $('#'+cfg.id+'-t-o').textContent = fmt(tasa, 3); $('#'+cfg.id+'-n-o').textContent = N;
    if (conMom){ $('#'+cfg.id+'-a-o').textContent = fmt(alfa,2); $('#'+cfg.id+'-m-o').textContent = fmt(m,2); }
    let w = -3, v = 0; const tray = [w]; let diverge = false;
    for (let k = 0; k < 30; k++){ const G = -N*(w-2); v = alfa*v + tasa*G; w = m*w + v; tray.push(w); if (!isFinite(w) || Math.abs(w) > 1e6){ diverge = true; break; } }
    let g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva del error y pasos del descenso"><defs><clipPath id="'+cfg.id+'-c"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'"/></clipPath></defs>';
    for (const e of [0,6,12,18]) g += '<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(e)+'" y2="'+Y(e)+'" stroke="var(--line)"/><text x="'+(x0-6)+'" y="'+(Y(e)+4)+'" text-anchor="end">'+e+'</text>';
    for (let ww = -4; ww <= 8; ww += 2) g += '<text x="'+X(ww)+'" y="'+(y1+16)+'" text-anchor="middle">'+menos(ww)+'</text>';
    let pc = ''; for (let k = 0; k <= 120; k++){ const ww = wmin + k/10; pc += (k?'L':'M')+X(ww).toFixed(1)+' '+Y(0.5*(ww-2)**2).toFixed(1); }
    g += '<path d="'+pc+'" fill="none" stroke="var(--fwd)" stroke-width="2.2"/>';
    g += '<text x="'+X(2)+'" y="'+(y1-6)+'" text-anchor="middle" style="fill:var(--fwd)">mínimo w = 2</text><text x="'+(x1-4)+'" y="'+(y0+12)+'" text-anchor="end">error por patrón ½(w − 2)²</text>';
    let pt = ''; tray.forEach((ww,k) => { const c = Math.max(wmin-1, Math.min(wmax+1, ww)); pt += (k?'L':'M')+X(c).toFixed(1)+' '+Y(0.5*(c-2)**2).toFixed(1); });
    g += '<g clip-path="url(#'+cfg.id+'-c)"><path d="'+pt+'" fill="none" stroke="var(--back)" stroke-width="1.4"/>';
    tray.forEach((ww,k) => { if (ww < wmin-0.5 || ww > wmax+0.5) return; g += '<circle cx="'+X(ww)+'" cy="'+Y(0.5*(ww-2)**2)+'" r="'+(k===0?5:3.4)+'" fill="'+(k===0?'var(--ink)':'var(--back)')+'"/>'; });
    g += '</g></svg>';
    $('#'+cfg.id+'-g').innerHTML = g;
    const tn = tasa*N, fin = tray[tray.length-1];
    let estado, cls;
    if (diverge || Math.abs(fin-2) > 50){ estado = 'diverge'; cls = 'alerta'; }
    else if (conMom && m < 1){ estado = 'se estanca lejos del mínimo'; cls = 'alerta'; }
    else if (Math.abs(fin-2) > 0.05){ estado = (tn < 0.2 ? 'avanza muy lento' : 'todavía no llega'); cls = ''; }
    else { estado = (alfa === 0 && tn > 1) ? 'oscila y converge' : 'converge'; cls = 'bien'; }
    let o = '<span>paso efectivo Tasa × N = <b>'+fmt(tn,3)+'</b>'+(alfa>0?' · con α: ≈ '+fmt(tn/(1-alfa),3):'')+'</span>';
    if (!conMom) o += '<span>factor por paso (1 − Tasa·N) = <b>'+fmt(1-tn,3)+'</b></span>';
    o += '<span>w tras '+(tray.length-1)+' épocas = <b>'+(isFinite(fin) && Math.abs(fin) < 1e5 ? fmt(fin,3) : '∞')+'</b></span><span class="'+cls+'">'+estado+'</span>';
    if (conMom && m < 1){ const k = tn/(1-alfa); o += '<span>equilibrio w* = 2k/(1 − Momento + k) = <b>'+fmt(2*k/(1-m+k),3)+'</b></span>'; }
    $('#'+cfg.id+'-o').innerHTML = o;
  };
  el.querySelectorAll('input').forEach(i => i.oninput = act); act();
}

function tipoPaso(t){
  if (/hacia adelante/.test(t)) return 'fwd';
  if (/DeltaSalida/.test(t)) return 'dout';
  if (/DeltaCamada/.test(t)) return 'dhid';
  if (/suma a G/.test(t)) return 'grad';
  if (/ajuste/.test(t)) return 'adj';
  return 'none';
}

    const fwd = D.traza.find(s => s.titulo.startsWith('Patrón '+p+': hacia adelante'));
    const mx = fwd.titulo.match(/\((\d), (\d)\)/); xs = [mx[1], mx[2]];
    ocultas = fwd.valores[0][1].split(/\s+/); ys = fwd.valores[1][1];
  }
  const X = [[46,72],[46,168]], H = [[196,40],[196,120],[196,200]], Y = [356,120];
  const azul = 'var(--fwd)', nar = 'var(--back)', gris = 'var(--line)';
  const c1 = t==='fwd' ? azul : (t==='grad'||t==='adj' ? nar : gris);
  const c2 = t==='fwd' ? azul : (t==='dout'||t==='dhid'||t==='grad'||t==='adj' ? nar : gris);
  const w1 = (t==='adj'||t==='grad') ? 2.2 : (t==='fwd'?1.8:1.2), w2 = (t==='dhid'||t==='adj'||t==='grad') ? 2.4 : (t==='fwd'?1.8:1.2);
  let s = '<svg class="red-svg" viewBox="0 0 410 240" role="img" aria-label="Red 2-3-1 del ejemplo de clase">';
  X.forEach(a => H.forEach(b => s += '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+c1+'" stroke-width="'+w1+'"'+(t==='grad'?' stroke-dasharray="4 3"':'')+'/>'));
  H.forEach(b => s += '<line x1="'+b[0]+'" y1="'+b[1]+'" x2="'+Y[0]+'" y2="'+Y[1]+'" stroke="'+c2+'" stroke-width="'+w2+'"'+(t==='grad'?' stroke-dasharray="4 3"':'')+'/>');
  const nodo = (x,y,txt,col,r) => '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="11">'+esc(menos(txt))+'</text>';
  X.forEach((a,i) => s += nodo(a[0], a[1], xs[i], p ? azul : 'var(--muted)', 19));
  const colH = t==='dhid' ? nar : (t==='fwd' ? azul : 'var(--muted)');
  H.forEach((b,i) => s += nodo(b[0], b[1], ocultas[i], colH, 24));
  s += nodo(Y[0], Y[1], ys, t==='dout'||t==='dhid' ? nar : (t==='fwd'?azul:'var(--muted)'), 26);
  s += '<text x="46" y="226" text-anchor="middle" font-size="10" fill="var(--muted)" style="fill:var(--muted)">entradas</text><text x="196" y="236" text-anchor="middle" font-size="10" style="fill:var(--muted)">capa oculta</text><text x="356" y="166" text-anchor="middle" font-size="10" style="fill:var(--muted)">salida</text>';
  return s + '</svg>';
}
RENDER.epoca = cont => {

  <section class="vista">
    <div class="cab"><span class="eyebrow">Ejemplo de clase · XOR 2-3-1 · sin sesgo · tasa 0,3 · momento 1</span><h2>Una época completa, línea por línea</h2>
      <p class="lede">Los números son los que calcula el programa con los pesos de la diapositiva. A la derecha, la función que está trabajando en ese momento, con las líneas exactas resaltadas.</p></div>
    <div class="puntos" id="e-puntos" aria-label="Pasos"></div>
    <div class="epoca">
      <div class="panel" id="e-izq"></div>
      <div class="panel" id="e-der"></div>
    </div>
  </section>`;

};
function pintarPaso(){
  const p = D.traza[PASO], r = p.ref, t = tipoPaso(p.titulo);

  $('#e-izq').innerHTML = '<span class="eyebrow">Paso '+(PASO+1)+' de '+D.traza.length+'</span><h3>'+esc(p.titulo)+'</h3>'+redSVG(p)+'<p>'+esc(p.texto)+'</p>'+
    (p.valores.length ? '<table class="valores">'+p.valores.map(v => '<tr><td>'+esc(v[0])+'</td><td>'+esc(menos(v[1]))+'</td></tr>').join('')+'</table>' : '')+
    '<div class="fila-btn"><button class="btn" id="e-ant"'+(PASO===0?' disabled':'')+'>← Anterior</button><button class="btn pri" id="e-sig"'+(PASO===D.traza.length-1?' disabled':'')+'>Siguiente →</button></div>';

  $('#e-der').innerHTML = '<div class="cab"><span class="eyebrow">'+(atras?'Hacia atrás':'Código en ejecución')+'</span><h3 style="font-family:var(--mono)">'+esc(r.archivo)+' › '+esc(r.funcion)+'</h3></div>'+
    snippet(r.archivo, r.ini_funcion, r.fin_funcion, r.linea, r.fin, atras)+'<div class="fila-btn">'+refBtn(r)+'</div>';
  centrarSnip($('#e-der'));
  $('#e-ant').onclick = () => { PASO--; pintarPaso(); };
  $('#e-sig').onclick = () => { PASO++; pintarPaso(); };
}

/* =================================================================
   ¿DÓNDE ESTÁ?
   ================================================================= */
let DQ = {orden:null, i:0, resp:null, ops:null};
function mezclar(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function opcionesDonde(q){
  const ok = claveDe(q.ref.archivo, q.ref.funcion);
  const anot = Object.keys(D.anotaciones).filter(k => k !== ok);
  const mismo = mezclar(anot.filter(k => k.startsWith(q.ref.archivo+'::')));
  const otros = mezclar(anot.filter(k => !k.startsWith(q.ref.archivo+'::')));
  const elegidas = [...mismo.slice(0,1), ...otros].slice(0,3);
  return mezclar([ok, ...elegidas]);
}
RENDER.donde = cont => {
  if (!DQ.orden) { DQ.orden = mezclar(D.donde.map((_,i) => i)); DQ.i = 0; DQ.resp = null; DQ.ops = null; }
  cont.innerHTML = `
  <section class="vista">
    <div class="cab"><span class="eyebrow">Práctica de ubicación</span><h2>¿Dónde está?</h2>
      <p class="lede">La pregunta típica de la sustentación: «muéstreme dónde hace…». Elija el archivo y la función; después verá la línea exacta.</p></div>
    <div class="practica" id="d-cont"></div>
  </section>`;
  pintarDonde();
};
function pintarDonde(){
  const c = $('#d-cont'); const idx = DQ.orden[DQ.i]; const q = D.donde[idx];
  if (!DQ.ops) DQ.ops = opcionesDonde(q);
  const ok = claveDe(q.ref.archivo, q.ref.funcion);
  const tot = D.donde.length; const bien = Object.values(P.donde).filter(x=>x).length; const hechas = Object.keys(P.donde).length;
  let h = '<div class="marcador"><span>Pregunta <b>'+(DQ.i+1)+'</b> de '+tot+'</span><span>Acertadas alguna vez: <b>'+bien+'</b> de '+tot+'</span><span>Respondidas: <b>'+hechas+'</b></span></div><div class="barra-prog"><i style="width:'+(100*(DQ.i)/tot)+'%"></i></div>';
  h += '<p class="pregunta">'+esc(q.pregunta)+'</p><div class="opciones codigo-op">'+DQ.ops.map((k,i) => {
    const [a, f] = k.split('::'); let cls = '';
    if (DQ.resp){ if (k===ok) cls = 'bien'; else if (k===DQ.resp) cls = 'mal'; }
    return '<button data-k="'+esc(k)+'" class="'+cls+'"'+(DQ.resp?' disabled':'')+'><span class="letra">'+'ABCD'[i]+'</span><span>'+a+' › '+esc(f)+'</span></button>'; }).join('')+'</div>';
  if (DQ.resp){
    const acierto = DQ.resp === ok; const r = q.ref; const ini = Math.max(r.ini_funcion, r.linea - 4), fin = Math.min(r.fin_funcion, r.fin + 4);
    h += '<p class="veredicto '+(acierto?'bien':'mal')+'">'+(acierto?'Correcto.':'No. Está en '+r.archivo+' › '+esc(r.funcion)+'.')+' Línea '+r.linea+(r.fin!==r.linea?'–'+r.fin:'')+'.</p>'+snippet(r.archivo, ini, fin, r.linea, r.fin)+
      '<div class="fila-btn"><button class="btn pri" id="d-sig">'+(DQ.i===tot-1?'Volver a empezar':'Siguiente pregunta →')+'</button>'+refBtn(r)+'</div>';
  }
  c.innerHTML = h;
  c.querySelectorAll('.opciones button').forEach(b => b.onclick = () => { DQ.resp = b.dataset.k; P.donde[idx] = !!P.donde[idx] || DQ.resp === ok; guardar(); pintarDonde(); });
  const s = $('#d-sig'); if (s) s.onclick = () => { if (DQ.i === tot-1){ DQ.orden = mezclar(DQ.orden); DQ.i = 0; } else DQ.i++; DQ.resp = null; DQ.ops = null; pintarDonde(); };
}

/* =================================================================
   PREGUNTAS DEL PROFESOR
   ================================================================= */
let PROF_TEMA = 'Todas';
RENDER.profesor = cont => {
  const temas = ['Todas', ...new Set(D.profesor.map(p => p.tema))];
  cont.innerHTML = `
  <section class="vista">
    <div class="cab"><span class="eyebrow">Ensayo de la sustentación</span><h2>Lo que probablemente le van a preguntar</h2>
      <p class="lede">Intente responder en voz alta antes de abrir la respuesta, y después muestre el código con la referencia. Marque las que ya domina.</p></div>
    <div class="filtros" id="p-filtros">${temas.map(t => '<button data-t="'+t+'" aria-pressed="'+(t===PROF_TEMA)+'">'+t+'</button>').join('')}</div>
    <div class="lista-prof" id="p-lista"></div>
  </section>`;
  const pintar = () => {
    $('#p-lista').innerHTML = D.profesor.map((p,i) => [p,i]).filter(([p]) => PROF_TEMA==='Todas' || p.tema===PROF_TEMA).map(([p,i]) =>
      '<details class="preg-prof"><summary><span class="t">'+esc(p.tema)+'</span><span class="q">'+esc(p.pregunta)+'</span><span class="ok">'+(P.prof[i]?'✓ dominada':'')+'</span></summary><div class="resp"><p>'+esc(p.respuesta)+'</p>'+p.refs.map(r => refBtn(r, true)).join('')+
      '<label style="display:flex;gap:8px;align-items:center;font-size:.86rem"><input type="checkbox" id="prof-'+i+'" data-i="'+i+'"'+(P.prof[i]?' checked':'')+'> La domino</label></div></details>').join('');
    $('#p-lista').querySelectorAll('input[type=checkbox]').forEach(x => x.onchange = () => { if (x.checked) P.prof[x.dataset.i] = 1; else delete P.prof[x.dataset.i]; guardar(); x.closest('details').querySelector('.ok').textContent = x.checked ? '✓ dominada' : ''; });
  };
  $('#p-filtros').onclick = e => { const b = e.target.closest('button'); if (!b) return; PROF_TEMA = b.dataset.t; document.querySelectorAll('#p-filtros button').forEach(x => x.setAttribute('aria-pressed', x===b)); pintar(); };
  pintar();
};

/* =================================================================
   QUIZ
   ================================================================= */
let QZ = {i:0, resp:null};
RENDER.quiz = cont => {
  cont.innerHTML = `
  <section class="vista">
    <div class="cab"><span class="eyebrow">Autoevaluación</span><h2>Quiz de lectura de código</h2>
      <p class="lede">Veinte preguntas sobre qué hace cada línea y qué pasaría si la cambia. Cada explicación lleva a su código.</p></div>
    <div class="practica" id="q-cont"></div>
  </section>`;
  pintarQuiz();
};
function pintarQuiz(){
  const c = $('#q-cont'), n = D.quiz.length;
  if (QZ.i >= n){
    const bien = D.quiz.filter((_,i) => P.quiz[i] && P.quiz[i].ok).length;
    c.innerHTML = '<p class="pregunta">Resultado: '+bien+' de '+n+'</p><p class="lede">'+(bien===n?'Todo correcto.':'Repase las que falló: cada una lleva a su línea en el explorador.')+'</p><div class="opciones">'+
      D.quiz.map((q,i) => '<button data-i="'+i+'" class="'+(P.quiz[i]?(P.quiz[i].ok?'bien':'mal'):'')+'"><span class="letra">'+(i+1)+'</span><span>'+esc(q.pregunta)+'</span></button>').join('')+'</div><div class="fila-btn"><button class="btn pri" id="q-otra">Hacer el quiz de nuevo</button></div>';
    c.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { QZ.i = +b.dataset.i; QZ.resp = null; pintarQuiz(); });
    $('#q-otra').onclick = () => { P.quiz = {}; guardar(); QZ = {i:0, resp:null}; pintarQuiz(); };
    return;
  }
  const q = D.quiz[QZ.i];
  let h = '<div class="marcador"><span>Pregunta <b>'+(QZ.i+1)+'</b> de '+n+'</span><span>Correctas: <b>'+Object.values(P.quiz).filter(x=>x.ok).length+'</b></span></div><div class="barra-prog"><i style="width:'+(100*QZ.i/n)+'%"></i></div>';
  h += '<p class="pregunta">'+esc(q.pregunta)+'</p><div class="opciones">'+q.opciones.map((o,i) => {
    let cls = ''; if (QZ.resp !== null){ if (i===q.correcta) cls = 'bien'; else if (i===QZ.resp) cls = 'mal'; }
    return '<button data-o="'+i+'" class="'+cls+'"'+(QZ.resp!==null?' disabled':'')+'><span class="letra">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>'; }).join('')+'</div>';
  if (QZ.resp !== null){
    const ok = QZ.resp === q.correcta; const r = q.ref;
    h += '<p class="veredicto '+(ok?'bien':'mal')+'">'+(ok?'Correcto.':'Incorrecto.')+'</p><p>'+esc(q.explicacion)+'</p>'+refBtn(r, true)+
      '<div class="fila-btn"><button class="btn pri" id="q-sig">'+(QZ.i===n-1?'Ver resultado':'Siguiente →')+'</button></div>';
  }
  c.innerHTML = h;
  c.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { QZ.resp = +b.dataset.o; P.quiz[QZ.i] = {ok: QZ.resp === q.correcta}; guardar(); pintarQuiz(); });
  const s = $('#q-sig'); if (s) s.onclick = () => { QZ.i++; QZ.resp = null; pintarQuiz(); };
}

/* =================================================================
   REPASO
   ================================================================= */
RENDER.repaso = cont => {
  let filas = '', g = null;
  for (const f of D.formulas){
    if (f.grupo !== g){ g = f.grupo; filas += '<tr class="grupo"><td colspan="4">'+esc(g)+'</td></tr>'; }
    filas += '<tr><td class="c">'+f.codigo+'</td><td>'+esc(f.nombre)+'</td><td class="e">'+esc(f.expr)+'</td><td>'+(f.ref?refBtn(f.ref):'')+'</td></tr>';
  }
  cont.innerHTML = `
  <section class="vista">
    <div class="cab"><span class="eyebrow">Hoja de repaso</span><h2>Fórmulas, ubicaciones y números para tener a mano</h2>
      <p class="lede">Cada fórmula con la función que la implementa. Los números son resultados reales del simulador que aparecen en el informe.</p></div>
    <div class="scroll-x"><table class="tabla"><thead><tr><th>Código</th><th>Nombre</th><th>Expresión</th><th>Dónde está</th></tr></thead><tbody>${filas}</tbody></table></div>
    <div class="dos">
      <div class="scroll-x"><table class="tabla"><thead><tr><th>Experimento</th><th>Resultado</th></tr></thead><tbody>${D.numeros.map(n => '<tr><td>'+esc(n[0])+'</td><td class="v">'+esc(n[1])+'</td></tr>').join('')}</tbody></table></div>
      <div class="panel">
        <h3>Frases para responder rápido</h3>
        <p><b>El backpropagation</b> está en red_neuronal.py: propagar_con (adelante), retropropagar (deltas), _acumular (G), _aplicar (ajuste), todo dentro de entrenar.</p>
        <p><b>Las fórmulas de clase</b> están en formulas.py, una función por fórmula, con su código F en el comentario.</p>
        <p><b>n capas y n neuronas</b>: pesos[c][j][i] y ciclos con range(len(...)), nada fijo.</p>
        <p><b>Lotes</b>: G se suma con los N patrones y se ajusta una vez por época; el paso efectivo es ≈ tasa × N.</p>
        <p><b>Sin librerías</b>: e^x por reducción de rango y Taylor; aleatorios con congruencial propio; matplotlib y tkinter solo dibujan.</p>
        <p><b>Superficie 3D</b>: rejilla + F15 + marching tetrahedra propio en graficas.py.</p>
      </div>
    </div>
  </section>`;
};

/* ---------- arranque ---------- */
pintarAvance();
const inicial = (location.hash || '').replace('#','');
ir(RENDER[inicial] ? inicial : (P.vista && RENDER[P.vista] ? P.vista : 'mapa'), true);
