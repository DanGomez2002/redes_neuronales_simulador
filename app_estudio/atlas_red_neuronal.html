mentos.py::ejecutar_ejemplo_clase", "main.py::Aplicacion._ejecutar", "main.py::leer_int", "main.py::leer_positivo"], "llamada_por": []}, "main.py::Aplicacion._redibujar_visible": {"ini": 1495, "fin": 1513, "doc": "", "llama": ["main.py::PestanaGrafica.vista_3d"], "llamada_por": ["main.py::Aplicacion.__init__", "main.py::Aplicacion._mostrar", "main.py::Aplicacion._mover_epoca", "main.py::Aplicacion.clasificar_punto", "main.py::Aplicacion.mostrar_final", "main.py::Aplicacion.predecir_punto"]}, "main.py::insertar_fila": {"ini": 1516, "fin": 1522, "doc": "Baja una fila todos los controles de 'marco' que están en la fila 'fila'", "llama": [], "llamada_por": ["main.py::Aplicacion._pestana_red", "main.py::Aplicacion._pestana_regresion"]}, "main.py::leer_vector_seguro": {"ini": 1525, "fin": 1529, "doc": "", "llama": ["main.py::leer_vector"], "llamada_por": ["main.py::Aplicacion._cambio_entradas", "main.py::Aplicacion._cambio_entradas_regresion"]}, "main.py::main": {"ini": 1532, "fin": 1540, "doc": "", "llama": ["main.py::Aplicacion"], "llamada_por": []}}, "anotaciones": {"formulas.py::exponencial": {"archivo": "formulas.py", "funcion": "exponencial", "ini": 216, "fin": 241, "que": "Calcula e^x sin librerías. La necesita la sigmoide (F2), así que es la base matemática de toda la red.", "lineas": [{"linea": 224, "nota": "NaN es el único valor distinto de sí mismo: si la red ya divergió, se devuelve tal cual en vez de entrar en un ciclo infinito."}, {"linea": 226, "nota": "Por encima de 709, e^x no cabe en un número de punto flotante de 64 bits: se devuelve infinito."}, {"linea": 230, "nota": "Reducción de rango: se busca el entero k para que x = k·ln 2 + r con |r| ≤ 0,35."}, {"linea": 231, "nota": "r es el residuo pequeño; con él la serie converge en unos 15 términos."}, {"linea": 236, "nota": "Cada término se obtiene del anterior: r^n/n! = (r^(n−1)/(n−1)!)·r/n, sin calcular factoriales."}, {"linea": 238, "nota": "Criterio de parada: el término ya no cambia el resultado en doble precisión."}, {"linea": 241, "nota": "e^x = 2^k · e^r; la potencia de 2 se calcula por cuadrados sucesivos (M9)."}], "conceptos": ["sigmoide", "sin_librerias"], "formulas": ["M10", "M9"]}, "formulas.py::sigmoide": {"archivo": "formulas.py", "funcion": "sigmoide", "ini": 257, "fin": 265, "que": "Función de activación de todas las neuronas ocultas (y de la salida en clasificación). Lleva cualquier suma S a un valor entre 0 y 1.", "lineas": [{"linea": 262, "nota": "Para S positivo se usa la forma de clase: 1/(1 + e^(−S)); el exponente es negativo y no desborda."}, {"linea": 264, "nota": "Para S negativo se multiplica arriba y abajo por e^S: e^S/(1 + e^S). Así nunca se calcula e de un número grande."}, {"linea": 265, "nota": "Las dos formas dan el mismo valor; solo cambia cuál es numéricamente segura."}], "conceptos": ["sigmoide", "saturacion"], "formulas": ["F2"]}, "formulas.py::derivada_sigmoide": {"archivo": "formulas.py", "funcion": "derivada_sigmoide", "ini": 268, "fin": 270, "que": "Derivada de la sigmoide escrita con la salida: y' = y(1 − y). No vuelve a calcular la exponencial.", "lineas": [{"linea": 270, "nota": "Máximo 0,25 cuando y = 0,5; cerca de 0 cuando y se acerca a 0 o a 1 (neurona saturada)."}], "conceptos": ["sigmoide", "saturacion"], "formulas": ["F3"]}, "formulas.py::suma_ponderada": {"archivo": "formulas.py", "funcion": "suma_ponderada", "ini": 247, "fin": 254, "que": "La operación básica de una neurona: S = Σ w·x + θ·x0.", "lineas": [{"linea": 252, "nota": "Recorre tantos pesos como entradas tenga la neurona: por eso sirve para n entradas."}, {"linea": 254, "nota": "El sesgo θ entra con su entrada fija x0 (−1 en la convención de clase)."}], "conceptos": ["neurona", "sesgo"], "formulas": ["F1"]}, "formulas.py::error_salida": {"archivo": "formulas.py", "funcion": "error_salida", "ini": 273, "fin": 275, "que": "Error de una salida: e = d − y (deseado menos obtenido).", "lineas": [{"linea": 275, "nota": "El signo importa: con e = d − y, sumar Tasa·G baja el error."}], "conceptos": ["error"], "formulas": ["F4"]}, "formulas.py::delta_salida": {"archivo": "formulas.py", "funcion": "delta_salida", "ini": 278, "fin": 280, "que": "Delta de la capa de salida: DeltaSalida = Error · Derivada_FA (diapositiva).", "lineas": [{"linea": 280, "nota": "e·y(1−y). En el XOR, patrón (0,0): −0,406 · 0,406·(1−0,406) = −0,098."}], "conceptos": ["delta_salida"], "formulas": ["F5"]}, "formulas.py::delta_camada": {"archivo": "formulas.py", "funcion": "delta_camada", "ini": 283, "fin": 292, "que": "Delta de una neurona oculta: Derivada_FA · Σ(peso · delta de la capa siguiente).", "lineas": [{"linea": 289, "nota": "Acumula la responsabilidad del error que llega desde adelante."}, {"linea": 290, "nota": "Recorre TODAS las neuronas de la capa siguiente: generaliza \"peso · DeltaS\" de la diapositiva a varias neuronas."}, {"linea": 291, "nota": "Cada neurona de adelante devuelve su delta ponderado por el peso que la une con esta neurona."}, {"linea": 292, "nota": "Se multiplica por y' de esta neurona. Con y = 0,5: 0,25·(−0,017)·(−0,098) ≈ 0,000 (DeltaC1 del ejemplo)."}], "conceptos": ["delta_camada", "regla_cadena"], "formulas": ["F6"]}, "formulas.py::entrada_por_delta": {"archivo": "formulas.py", "funcion": "entrada_por_delta", "ini": 295, "fin": 298, "que": "Contribución de un patrón al gradiente de un peso: entrada · delta.", "lineas": [{"linea": 298, "nota": "Se suma sobre los patrones en _acumular para formar G (F7)."}], "conceptos": ["gradiente"], "formulas": ["F7"]}, "formulas.py::ajuste_profesor": {"archivo": "formulas.py", "funcion": "ajuste_profesor", "ini": 301, "fin": 304, "que": "Regla de ajuste de clase: Peso(n+1) = Peso(n)·Momento + Entrada·Delta·Tasa.", "lineas": [{"linea": 304, "nota": "G ya es Σ entrada·delta. Con Momento = 1 es descenso por gradiente puro; con Momento < 1 el peso se encoge cada época."}], "conceptos": ["ajuste", "momento"], "formulas": ["F8"]}, "formulas.py::ajuste_momento_clasico": {"archivo": "formulas.py", "funcion": "ajuste_momento_clasico", "ini": 307, "fin": 313, "que": "Momento clásico (opción): el cambio actual suma α veces el cambio anterior (inercia).", "lineas": [{"linea": 312, "nota": "ΔW(n) = Tasa·G + α·ΔW(n−1). Si los cambios van en la misma dirección se acumulan; si alternan, se cancelan."}, {"linea": 313, "nota": "Devuelve también el cambio para guardarlo y usarlo en la siguiente época."}], "conceptos": ["momento"], "formulas": ["F9"]}, "formulas.py::error_epoca": {"archivo": "formulas.py", "funcion": "error_epoca", "ini": 316, "fin": 321, "que": "Error de la época: E = ½ Σ e² sobre todos los patrones y salidas.", "lineas": [{"linea": 321, "nota": "Es la función de costo que el gradiente minimiza."}], "conceptos": ["error"], "formulas": ["F10"]}, "formulas.py::error_cuadratico_medio": {"archivo": "formulas.py", "funcion": "error_cuadratico_medio", "ini": 324, "fin": 330, "que": "ECM = Σ e² / (N·m): permite comparar redes con distinto número de patrones o salidas.", "lineas": [{"linea": 330, "nota": "len(errores) = N patrones × m salidas."}], "conceptos": ["error"], "formulas": ["F11"]}, "formulas.py::clase_de_la_salida": {"archivo": "formulas.py", "funcion": "clase_de_la_salida", "ini": 356, "fin": 366, "que": "Convierte las salidas de la red en una clase.", "lineas": [{"linea": 360, "nota": "Una sola salida (2 clases): clase 2 si y ≥ 0,5."}, {"linea": 363, "nota": "Varias salidas (one-hot): gana la neurona con la salida más alta (argmax)."}], "conceptos": ["clasificacion"], "formulas": ["F14"]}, "formulas.py::funcion_frontera": {"archivo": "formulas.py", "funcion": "funcion_frontera", "ini": 369, "fin": 377, "que": "Función que vale 0 justo en la superficie de separación; graficas.py busca dónde cambia de signo.", "lineas": [{"linea": 375, "nota": "Una salida: la red duda cuando y = 0,5."}, {"linea": 377, "nota": "Varias salidas: la clase k empata con la mejor de las demás."}], "conceptos": ["superficie"], "formulas": ["F15"]}, "formulas.py::normalizar": {"archivo": "formulas.py", "funcion": "normalizar", "ini": 418, "fin": 423, "que": "Normalización mín-máx: x' = (x − mín)/(máx − mín), lleva cada entrada a [0, 1].", "lineas": [{"linea": 423, "nota": "Evita sumas S enormes que saturen la sigmoide."}], "conceptos": ["normalizacion"], "formulas": ["F16"]}, "formulas.py::coeficiente_determinacion": {"archivo": "formulas.py", "funcion": "coeficiente_determinacion", "ini": 397, "fin": 410, "que": "R² = 1 − Σ(d − y)²/Σ(d − media)²: medida de la regresión.", "lineas": [{"linea": 410, "nota": "1 = ajuste perfecto; 0 = no mejora a predecir la media."}], "conceptos": ["regresion"], "formulas": ["F26"]}, "red_neuronal.py::propagar_con": {"archivo": "red_neuronal.py", "funcion": "propagar_con", "ini": 44, "fin": 61, "que": "Propagación hacia adelante, capa por capa. Devuelve las salidas de TODAS las capas porque el backpropagation las necesita.", "lineas": [{"linea": 49, "nota": "a[0] son las entradas de la red."}, {"linea": 51, "nota": "Un ciclo por cada capa con pesos (ocultas + salida): sirve para n capas."}, {"linea": 52, "nota": "Las entradas de esta capa son las salidas de la capa anterior."}, {"linea": 54, "nota": "Un ciclo por cada neurona de la capa: sirve para n neuronas."}, {"linea": 55, "nota": "F1: suma ponderada de la neurona j con su fila de pesos pesos[c][j] y su sesgo."}, {"linea": 56, "nota": "Solo en regresión con salida lineal, la última capa usa y = S (F24)."}, {"linea": 59, "nota": "F2: en el resto de los casos, la sigmoide."}, {"linea": 60, "nota": "Se guarda la lista de salidas de la capa; al final a[-1] es la salida de la red."}], "conceptos": ["propagacion", "capas", "neurona"], "formulas": ["F1", "F2", "F24"]}, "red_neuronal.py::RedNeuronal.__init__": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.__init__", "ini": 66, "fin": 103, "que": "Crea la red a partir de la estructura [entradas, ocultas..., salidas] con pesos aleatorios en (−1, 1).", "lineas": [{"linea": 72, "nota": "Ej.: [3, 5, 3] → 3 entradas, una capa oculta de 5, 3 salidas."}, {"linea": 80, "nota": "Sin sesgo, x0 = 0 hace que θ·x0 no aporte nada."}, {"linea": 86, "nota": "Una capa de pesos por cada capa después de la de entrada."}, {"linea": 89, "nota": "Fila de pesos de la neurona: un peso por cada neurona de la capa anterior. pesos[c][j][i]."}, {"linea": 98, "nota": "Aquí se guarda una copia de todos los pesos en cada época: de ahí salen las gráficas de pesos y la barra de épocas."}], "conceptos": ["capas", "pesos_notacion", "sesgo"], "formulas": []}, "red_neuronal.py::RedNeuronal.retropropagar": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "ini": 152, "fin": 172, "que": "El corazón del backpropagation: errores de la salida y deltas de todas las capas, de atrás hacia adelante.", "lineas": [{"linea": 158, "nota": "F4: un error por cada neurona de salida."}, {"linea": 161, "nota": "Regresión con salida lineal: DeltaSalida = e (F25)."}, {"linea": 163, "nota": "F5: DeltaSalida = e·y(1 − y) para cada salida."}, {"linea": 164, "nota": "Recorre las capas ocultas desde la última hacia la primera: por eso se llama retropropagación."}, {"linea": 165, "nota": "Pesos de la capa de adelante (los ANTERIORES al ajuste)."}, {"linea": 168, "nota": "Pesos que salen de la neurona j hacia cada neurona k de adelante: columna j de la matriz."}, {"linea": 169, "nota": "F6: DeltaCamada de la neurona j."}, {"linea": 172, "nota": "deltas[c][j] = delta de la neurona j de la capa c."}], "conceptos": ["retropropagacion", "delta_salida", "delta_camada", "regla_cadena"], "formulas": ["F4", "F5", "F6", "F25"]}, "red_neuronal.py::RedNeuronal._acumular": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "ini": 179, "fin": 188, "que": "Suma la contribución de un patrón al gradiente: G[c][j][i] += entrada_i · delta_j.", "lineas": [{"linea": 182, "nota": "Las entradas de la capa c son las salidas de la capa anterior (a[c])."}, {"linea": 187, "nota": "F7: entrada que recibe el peso por el delta de la neurona destino."}, {"linea": 188, "nota": "El sesgo usa como entrada x0 = −1."}], "conceptos": ["gradiente", "lotes"], "formulas": ["F7"]}, "red_neuronal.py::RedNeuronal._aplicar": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._aplicar", "ini": 190, "fin": 207, "que": "Ajusta todos los pesos y sesgos con la regla elegida (F8 del profesor o F9 clásico).", "lineas": [{"linea": 196, "nota": "Momento clásico: necesita el cambio anterior guardado por peso (cambio_w)."}, {"linea": 200, "nota": "F8: Peso·Momento + G·Tasa."}, {"linea": 201, "nota": "Los sesgos se ajustan con la misma regla y su G propio (Gt)."}], "conceptos": ["ajuste", "momento"], "formulas": ["F8", "F9"]}, "red_neuronal.py::RedNeuronal.entrenar": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "ini": 253, "fin": 351, "que": "Ciclo de épocas: mide el error, revisa los criterios de parada y ajusta. Aquí se decide lotes o patrón.", "lineas": [{"linea": 275, "nota": "Una vuelta por época. La época 0 mide los pesos iniciales."}, {"linea": 281, "nota": "Ajuste por época (lotes), el de clase."}, {"linea": 284, "nota": "G empieza en cero al comienzo de cada época."}, {"linea": 287, "nota": "Hacia adelante con los MISMOS pesos para todos los patrones."}, {"linea": 288, "nota": "Hacia atrás: errores y deltas del patrón p."}, {"linea": 289, "nota": "Se suma la contribución del patrón; todavía no se toca ningún peso."}, {"linea": 294, "nota": "F10 con los pesos actuales (la misma pasada sirve para medir)."}, {"linea": 299, "nota": "Guarda error, ECM, exactitud/R² y una copia de los pesos (historial)."}, {"linea": 306, "nota": "Divergencia: el error dejó de ser número o creció un millón de veces."}, {"linea": 309, "nota": "Convergió: alcanzó el ECM objetivo."}, {"linea": 317, "nota": "Regresión: si el ECM deja de mejorar en \"paciencia\" épocas, se estabilizó (o divergió si quedó por encima del inicial)."}, {"linea": 328, "nota": "Botón Detener de la interfaz."}, {"linea": 334, "nota": "Por lotes: UN solo ajuste al final de la época con la suma de los N patrones."}, {"linea": 339, "nota": "Por patrón: se barajan los patrones (Fisher-Yates)..."}, {"linea": 346, "nota": "...y se ajusta después de cada patrón."}, {"linea": 350, "nota": "Cuenta de épocas = número de ajustes hechos."}], "conceptos": ["epoca", "lotes", "patron", "parada"], "formulas": ["F10", "F11"]}, "red_neuronal.py::RedNeuronal.evaluar": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.evaluar", "ini": 224, "fin": 234, "que": "Pasa todo el conjunto con los pesos actuales y mide E, ECM y exactitud o R² (usado en el ajuste por patrón).", "lineas": [], "conceptos": ["error"], "formulas": ["F10", "F11", "F12"]}, "red_neuronal.py::RedNeuronal.pesos_en_epoca": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.pesos_en_epoca", "ini": 133, "fin": 137, "que": "Devuelve los pesos de cualquier época del historial: la barra \"Época mostrada\" usa esto.", "lineas": [{"linea": 137, "nota": "historial_pesos[k] = pesos después de k ajustes."}], "conceptos": ["epoca"], "formulas": []}, "red_neuronal.py::RedNeuronal.nombres_pesos": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.nombres_pesos", "ini": 369, "fin": 378, "que": "Nombres de los pesos para las gráficas: w{capa}(destino, origen) y θ{capa}(neurona).", "lineas": [{"linea": 375, "nota": "Ej.: w2(1,n3) = capa 2, neurona destino 1, viene de la neurona oculta 3."}], "conceptos": ["pesos_notacion"], "formulas": []}, "red_neuronal.py::RedNeuronal._anotar_patron": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._anotar_patron", "ini": 393, "fin": 405, "que": "Escribe en la pestaña \"Proceso paso a paso\" las salidas, el error y los deltas de cada patrón, como las tablas de las diapositivas.", "lineas": [], "conceptos": ["retropropagacion"], "formulas": []}, "aleatorio.py::generar_xor": {"archivo": "aleatorio.py", "funcion": "generar_xor", "ini": 104, "fin": 125, "que": "XOR en n dimensiones: una nube por esquina del cubo; la clase es la paridad de la esquina.", "lineas": [{"linea": 111, "nota": "Hay 2^n esquinas; cada número binario es una esquina."}, {"linea": 114, "nota": "Se sacan los bits del número: cada bit dice si la coordenada vale 0 o \"lado\"."}, {"linea": 118, "nota": "Número de unos par → clase 1; impar → clase 2. Con 2 entradas es la tabla XOR."}, {"linea": 122, "nota": "Los puntos de cada clase se reparten por igual entre sus esquinas."}], "conceptos": ["xor", "datos"], "formulas": []}, "aleatorio.py::generar_nubes": {"archivo": "aleatorio.py", "funcion": "generar_nubes", "ini": 90, "fin": 101, "que": "Una nube por clase con el MISMO número de puntos; cada coordenada sale de la distribución elegida.", "lineas": [{"linea": 97, "nota": "Mismo número de puntos en todas las clases."}], "conceptos": ["datos"], "formulas": ["F17", "F18"]}, "aleatorio.py::GeneradorAleatorio.uniforme01": {"archivo": "aleatorio.py", "funcion": "GeneradorAleatorio.uniforme01", "ini": 39, "fin": 42, "que": "Generador congruencial lineal: X(k+1) = (aX + c) mod m; U = (X + 0,5)/m.", "lineas": [], "conceptos": ["sin_librerias", "datos"], "formulas": ["F17"]}, "experimentos.py::salidas_deseadas": {"archivo": "experimentos.py", "funcion": "salidas_deseadas", "ini": 113, "fin": 119, "que": "Codificación de la salida deseada según el número de clases.", "lineas": [{"linea": 118, "nota": "2 clases → una salida: d = 0 o d = 1 (como el XOR de clase)."}, {"linea": 119, "nota": "k clases → one-hot: 1 en la neurona de su clase y 0 en las demás."}], "conceptos": ["clasificacion"], "formulas": []}, "experimentos.py::ejecutar": {"archivo": "experimentos.py", "funcion": "ejecutar", "ini": 140, "fin": 179, "que": "Orquesta una clasificación: genera datos, normaliza, crea la red, entrena y calcula estadísticas.", "lineas": [{"linea": 148, "nota": "Mínimo de cada entrada para normalizar (F16)."}, {"linea": 155, "nota": "Arquitectura: entradas + capas ocultas + salidas (1 si hay 2 clases)."}, {"linea": 160, "nota": "Llama al ciclo de épocas."}], "conceptos": ["normalizacion", "capas"], "formulas": ["F16"]}, "experimentos.py::ejecutar_ejemplo_clase": {"archivo": "experimentos.py", "funcion": "ejecutar_ejemplo_clase", "ini": 182, "fin": 202, "que": "Reproduce el XOR de las diapositivas: red 2-3-1 sin sesgo, tasa 0,3, momento 1, con los pesos de clase.", "lineas": [{"linea": 190, "nota": "Carga los pesos iniciales de la diapositiva."}], "conceptos": ["ejemplo"], "formulas": []}, "experimentos.py::ejecutar_regresion": {"archivo": "experimentos.py", "funcion": "ejecutar_regresion", "ini": 208, "fin": 247, "que": "Regresión con la misma red: 1 salida lineal o sigmoide, entradas y salida normalizadas.", "lineas": [{"linea": 218, "nota": "Con salida sigmoide la salida deseada TIENE que estar en [0, 1]."}, {"linea": 226, "nota": "La salida deseada también se normaliza."}, {"linea": 231, "nota": "Hace que la red mida R² en vez de exactitud."}], "conceptos": ["regresion"], "formulas": ["F16", "F26"]}, "experimentos.py::guia_paso": {"archivo": "experimentos.py", "funcion": "guia_paso", "ini": 293, "fin": 317, "que": "Calcula el \"paso por época ≈ tasa × N\" que aparece debajo de la tasa.", "lineas": [{"linea": 306, "nota": "Con lotes, G suma N patrones: el cambio es del orden de tasa·N."}, {"linea": 310, "nota": "Con momento clásico la inercia multiplica el paso por 1/(1 − α)."}], "conceptos": ["tasa"], "formulas": []}, "experimentos.py::advertencia": {"archivo": "experimentos.py", "funcion": "advertencia", "ini": 325, "fin": 345, "que": "Detecta cuando la red no aprendió: divergencia, exactitud de azar (saturación), ECM que no baja, R² bajo.", "lineas": [{"linea": 340, "nota": "La sigmoide nunca da NaN: la saturación solo se ve porque la exactitud queda en el azar."}], "conceptos": ["saturacion"], "formulas": []}, "graficas.py::triangulos_superficie": {"archivo": "graficas.py", "funcion": "triangulos_superficie", "ini": 132, "fin": 173, "que": "Marching tetrahedra: construye la superficie de separación como triángulos, sin librerías.", "lineas": [{"linea": 139, "nota": "Recorre todos los cubos de la rejilla 18×18×18."}, {"linea": 150, "nota": "Valor de F15 en las 8 esquinas del cubo."}, {"linea": 155, "nota": "Si todas las esquinas tienen el mismo signo, la superficie no pasa por el cubo."}, {"linea": 158, "nota": "El cubo se parte en 6 tetraedros."}, {"linea": 163, "nota": "Un vértice aislado: la superficie corta el tetraedro en un triángulo."}, {"linea": 167, "nota": "Dos y dos: corta en un cuadrilátero, que se divide en dos triángulos."}], "conceptos": ["superficie"], "formulas": ["F15"]}, "graficas.py::_corte": {"archivo": "graficas.py", "funcion": "_corte", "ini": 125, "fin": 129, "que": "Punto de una arista donde f = 0, por interpolación lineal.", "lineas": [{"linea": 127, "nota": "Fracción del camino de p a q donde f se anula."}], "conceptos": ["superficie"], "formulas": []}, "graficas.py::_salidas_en_rejilla": {"archivo": "graficas.py", "funcion": "_salidas_en_rejilla", "ini": 82, "fin": 109, "que": "Evalúa la red en todos los nodos de la rejilla (en unidades originales) y guarda el resultado en caché.", "lineas": [{"linea": 88, "nota": "La clave incluye los límites: si cambian (punto nuevo lejano), se recalcula."}], "conceptos": ["superficie"], "formulas": []}, "graficas.py::dibujar_errores": {"archivo": "graficas.py", "funcion": "dibujar_errores", "ini": 385, "fin": 419, "que": "Gráficas de E (F10), ECM (F11) y exactitud (F12) o R² (F26) por época.", "lineas": [], "conceptos": ["error"], "formulas": ["F10", "F11"]}, "graficas.py::dibujar_pesos_capas": {"archivo": "graficas.py", "funcion": "dibujar_pesos_capas", "ini": 435, "fin": 462, "que": "Una gráfica por capa con la evolución de todos sus pesos (línea punteada = sesgo).", "lineas": [{"linea": 443, "nota": "Una subgráfica por cada capa con pesos."}], "conceptos": ["pesos_notacion"], "formulas": []}, "graficas.py::dibujar_todos_pesos": {"archivo": "graficas.py", "funcion": "dibujar_todos_pesos", "ini": 465, "fin": 489, "que": "Todos los pesos de la red en una sola gráfica, un color por capa.", "lineas": [], "conceptos": ["pesos_notacion"], "formulas": []}, "graficas.py::dibujar_red": {"archivo": "graficas.py", "funcion": "dibujar_red", "ini": 495, "fin": 549, "que": "Diagrama de la red con el valor de cada peso en la época elegida (azul positivo, rojo negativo).", "lineas": [], "conceptos": ["capas"], "formulas": []}, "main.py::Aplicacion._ver_codigo": {"archivo": "main.py", "funcion": "Aplicacion._ver_codigo", "ini": 356, "fin": 360, "que": "Registra el clic derecho de un control para abrir su función en VS Code.", "lineas": [{"linea": 359, "nota": "<Button-3> es el clic derecho en tkinter."}], "conceptos": ["clic_derecho"], "formulas": []}, "main.py::Aplicacion._abrir_codigo": {"archivo": "main.py", "funcion": "Aplicacion._abrir_codigo", "ini": 362, "fin": 376, "que": "Abre en VS Code el archivo y la línea de una función.", "lineas": [{"linea": 363, "nota": "Python guarda en cada función el archivo donde se definió..."}, {"linea": 364, "nota": "...y la línea de su def: siempre coincide aunque el archivo cambie."}, {"linea": 371, "nota": "Si el comando code está instalado, \"code -g archivo:línea\" abre esa línea y trae VS Code al frente."}, {"linea": 374, "nota": "Si no, Windows abre la dirección vscode://file/ruta:línea con VS Code."}], "conceptos": ["clic_derecho"], "formulas": []}, "main.py::Aplicacion._ejecutar": {"archivo": "main.py", "funcion": "Aplicacion._ejecutar", "ini": 1379, "fin": 1428, "que": "Entrena en un hilo aparte para que la ventana no se congele; revisa el avance cada 150 ms.", "lineas": [{"linea": 1401, "nota": "El cálculo corre en otro hilo; tkinter solo se toca desde el hilo principal."}], "conceptos": ["interfaz"], "formulas": []}, "main.py::leer_ocultas": {"archivo": "main.py", "funcion": "leer_ocultas", "ini": 144, "fin": 158, "que": "Convierte \"6; 4\" en [6, 4]: dos capas ocultas de 6 y 4 neuronas.", "lineas": [], "conceptos": ["capas"], "formulas": []}, "main.py::leer_momento": {"archivo": "main.py", "funcion": "leer_momento", "ini": 112, "fin": 122, "que": "Valida el momento de la fórmula del profesor: 0 < Momento ≤ 1.", "lineas": [], "conceptos": ["momento"], "formulas": []}}, "conceptos": [{"id": "neurona", "nombre": "Neurona", "grupo": "Red", "texto": "Unidad que recibe entradas, calcula la suma ponderada S = Σ w·x + θ·x0 y la pasa por la función de activación. En el código no hay una clase \"Neurona\": una neurona es una fila de pesos pesos[c][j] más su sesgo sesgos[c][j].", "refs": [{"archivo": "formulas.py", "funcion": "suma_ponderada", "linea": 247, "fin": 254, "ini_funcion": 247, "fin_funcion": 254}, {"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 55, "fin": 55, "ini_funcion": 44, "fin_funcion": 61}]}, {"id": "capas", "nombre": "Capas (entrada, ocultas, salida)", "grupo": "Red", "texto": "La estructura es una lista como [3, 5, 3]. La capa de entrada no tiene pesos; cada capa siguiente tiene una lista de neuronas. \"6; 4\" en la interfaz son dos capas ocultas. Todo se recorre con ciclos que dependen del tamaño de las listas, por eso sirve para n capas y n neuronas.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.__init__", "linea": 86, "fin": 86, "ini_funcion": 66, "fin_funcion": 103}, {"archivo": "main.py", "funcion": "leer_ocultas", "linea": 144, "fin": 158, "ini_funcion": 144, "fin_funcion": 158}, {"archivo": "experimentos.py", "funcion": "ejecutar", "linea": 155, "fin": 155, "ini_funcion": 140, "fin_funcion": 179}]}, {"id": "pesos_notacion", "nombre": "Pesos y su notación", "grupo": "Red", "texto": "pesos[c][j][i] es el peso de la capa c que llega a la neurona j desde la neurona i de la capa anterior. En las gráficas se escribe w{c+1}(j+1, i+1): w2(1,n3) llega a la salida 1 desde la oculta 3. Se inician al azar en (−1, 1).", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.__init__", "linea": 89, "fin": 89, "ini_funcion": 66, "fin_funcion": 103}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.nombres_pesos", "linea": 369, "fin": 378, "ini_funcion": 369, "fin_funcion": 378}]}, {"id": "sesgo", "nombre": "Sesgo θ y x0 = −1", "grupo": "Red", "texto": "Cada neurona tiene un sesgo θ con entrada fija x0 = −1, así S = Σwx − θ. Permite que la frontera no pase por el origen. Sin sesgo, el XOR de clase se queda en 75 % porque (0,0) siempre da 0,5 en las ocultas.", "refs": [{"archivo": "formulas.py", "funcion": "suma_ponderada", "linea": 254, "fin": 254, "ini_funcion": 247, "fin_funcion": 254}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "linea": 188, "fin": 188, "ini_funcion": 179, "fin_funcion": 188}]}, {"id": "sigmoide", "nombre": "Sigmoide y su derivada", "grupo": "Activación", "texto": "y = 1/(1 + e^−S) lleva S a (0, 1). Su derivada y' = y(1 − y) se calcula con la salida, sin repetir la exponencial. La exponencial está hecha a mano con reducción de rango y serie de Taylor.", "refs": [{"archivo": "formulas.py", "funcion": "sigmoide", "linea": 257, "fin": 265, "ini_funcion": 257, "fin_funcion": 265}, {"archivo": "formulas.py", "funcion": "derivada_sigmoide", "linea": 268, "fin": 270, "ini_funcion": 268, "fin_funcion": 270}, {"archivo": "formulas.py", "funcion": "exponencial", "linea": 216, "fin": 241, "ini_funcion": 216, "fin_funcion": 241}]}, {"id": "saturacion", "nombre": "Saturación", "grupo": "Activación", "texto": "Si |S| es muy grande, y queda pegada a 0 o 1, y' ≈ 0 y la neurona deja de aprender. Pasa con tasas grandes o muchos puntos (tasa × N alto). No produce NaN: el simulador la detecta porque la exactitud queda en el azar.", "refs": [{"archivo": "formulas.py", "funcion": "derivada_sigmoide", "linea": 268, "fin": 270, "ini_funcion": 268, "fin_funcion": 270}, {"archivo": "experimentos.py", "funcion": "advertencia", "linea": 340, "fin": 340, "ini_funcion": 325, "fin_funcion": 345}, {"archivo": "experimentos.py", "funcion": "guia_paso", "linea": 293, "fin": 317, "ini_funcion": 293, "fin_funcion": 317}]}, {"id": "propagacion", "nombre": "Propagación hacia adelante", "grupo": "Algoritmo", "texto": "Las entradas recorren la red capa por capa: cada capa usa como entradas las salidas de la anterior. Se guardan todas las salidas intermedias (lista a) porque el backpropagation las necesita.", "refs": [{"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 44, "fin": 61, "ini_funcion": 44, "fin_funcion": 61}]}, {"id": "error", "nombre": "Error, E y ECM", "grupo": "Algoritmo", "texto": "e = d − y por salida; E = ½Σe² es la función de costo; ECM = Σe²/(N·m). Se miden en cada época con los pesos de esa época.", "refs": [{"archivo": "formulas.py", "funcion": "error_salida", "linea": 273, "fin": 275, "ini_funcion": 273, "fin_funcion": 275}, {"archivo": "formulas.py", "funcion": "error_epoca", "linea": 316, "fin": 321, "ini_funcion": 316, "fin_funcion": 321}, {"archivo": "formulas.py", "funcion": "error_cuadratico_medio", "linea": 324, "fin": 330, "ini_funcion": 324, "fin_funcion": 330}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 294, "fin": 294, "ini_funcion": 253, "fin_funcion": 351}]}, {"id": "delta_salida", "nombre": "DeltaSalida", "grupo": "Algoritmo", "texto": "DeltaSalida = Error · Derivada_FA = e·y(1−y). En regresión con salida lineal la derivada es 1 y DeltaSalida = e.", "refs": [{"archivo": "formulas.py", "funcion": "delta_salida", "linea": 278, "fin": 280, "ini_funcion": 278, "fin_funcion": 280}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 163, "fin": 163, "ini_funcion": 152, "fin_funcion": 172}]}, {"id": "delta_camada", "nombre": "DeltaCamada (capas ocultas)", "grupo": "Algoritmo", "texto": "DeltaCamada = Derivada_FA · Σ(peso · delta de adelante). Con una sola neurona adelante es \"Derivada · peso · DeltaS\" de la diapositiva. Se calcula con los pesos ANTERIORES al ajuste.", "refs": [{"archivo": "formulas.py", "funcion": "delta_camada", "linea": 283, "fin": 292, "ini_funcion": 283, "fin_funcion": 292}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 169, "fin": 169, "ini_funcion": 152, "fin_funcion": 172}]}, {"id": "retropropagacion", "nombre": "Retropropagación (de atrás hacia adelante)", "grupo": "Algoritmo", "texto": "Primero se calculan los deltas de la salida y luego los de cada capa oculta, desde la última hasta la primera: range(L − 2, −1, −1).", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 164, "fin": 164, "ini_funcion": 152, "fin_funcion": 172}]}, {"id": "regla_cadena", "nombre": "Regla de la cadena", "grupo": "Algoritmo", "texto": "DeltaCamada es la regla de la cadena: la derivada del error respecto a la salida de una neurona oculta es la suma de cómo afecta a cada neurona de adelante (peso·delta), multiplicada por su propia derivada.", "refs": [{"archivo": "formulas.py", "funcion": "delta_camada", "linea": 291, "fin": 291, "ini_funcion": 283, "fin_funcion": 292}]}, {"id": "gradiente", "nombre": "Gradiente G = Σ Entrada·Delta", "grupo": "Algoritmo", "texto": "La contribución de cada peso es la entrada que recibe por el delta de la neurona a la que llega; se suma sobre los patrones. Con e = d − y, G es −∂E/∂w, así que Peso + Tasa·G baja el error (comprobado con diferencias finitas).", "refs": [{"archivo": "formulas.py", "funcion": "entrada_por_delta", "linea": 295, "fin": 298, "ini_funcion": 295, "fin_funcion": 298}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "linea": 179, "fin": 188, "ini_funcion": 179, "fin_funcion": 188}]}, {"id": "ajuste", "nombre": "Ajuste de los pesos", "grupo": "Algoritmo", "texto": "Peso(n+1) = Peso(n)·Momento + G·Tasa, aplicado a todos los pesos y sesgos. Aunque se describe \"de atrás hacia adelante\", todos los deltas ya se calcularon con los pesos viejos, así que el orden no cambia el resultado.", "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._aplicar", "linea": 190, "fin": 207, "ini_funcion": 190, "fin_funcion": 207}]}, {"id": "momento", "nombre": "Momento (profesor y clásico)", "grupo": "Algoritmo", "texto": "Profesor: Peso·Momento; con 1 es gradiente puro, con <1 encoge los pesos (0,99 deja el XOR en 50 %). Clásico: ΔW = Tasa·G + α·ΔW anterior, da inercia y acelera; paso efectivo ≈ Tasa/(1 − α).", "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}, {"archivo": "formulas.py", "funcion": "ajuste_momento_clasico", "linea": 307, "fin": 313, "ini_funcion": 307, "fin_funcion": 313}, {"archivo": "main.py", "funcion": "leer_momento", "linea": 112, "fin": 122, "ini_funcion": 112, "fin_funcion": 122}]}, {"id": "tasa", "nombre": "Tasa de aprendizaje y tasa × N", "grupo": "Algoritmo", "texto": "Tamaño del paso. Con lotes, G suma N patrones: el paso por época es ≈ Tasa × N. Si se duplican los puntos con la misma tasa, el paso se duplica; por eso la tasa por defecto es pequeña.", "refs": [{"archivo": "experimentos.py", "funcion": "guia_paso", "linea": 306, "fin": 306, "ini_funcion": 293, "fin_funcion": 317}, {"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}]}, {"id": "epoca", "nombre": "Época e historial", "grupo": "Entrenamiento", "texto": "Una pasada por todos los patrones. historial[k] guarda los pesos después de k ajustes y el error medido con esos pesos; la época 0 son los pesos iniciales.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 275, "fin": 275, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._registrar_estado", "linea": 236, "fin": 243, "ini_funcion": 236, "fin_funcion": 243}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.pesos_en_epoca", "linea": 133, "fin": 137, "ini_funcion": 133, "fin_funcion": 137}]}, {"id": "lotes", "nombre": "Ajuste por época (lotes)", "grupo": "Entrenamiento", "texto": "Todos los patrones se evalúan con los mismos pesos, se suma G y se ajusta UNA vez al final de la época (como el ejemplo de clase). Curva de error suave, no depende del orden.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 281, "fin": 281, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 334, "fin": 334, "ini_funcion": 253, "fin_funcion": 351}]}, {"id": "patron", "nombre": "Ajuste por patrón", "grupo": "Entrenamiento", "texto": "Se ajusta después de cada patrón, barajando el orden. N ajustes por época; trayectoria más ruidosa.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 339, "fin": 339, "ini_funcion": 253, "fin_funcion": 351}]}, {"id": "parada", "nombre": "Criterios de parada", "grupo": "Entrenamiento", "texto": "Divergencia (error no numérico o ×10⁶), ECM objetivo, máximo de épocas, botón Detener y, en regresión, estabilización del ECM.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 306, "fin": 306, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 317, "fin": 317, "ini_funcion": 253, "fin_funcion": 351}]}, {"id": "clasificacion", "nombre": "Clasificación y one-hot", "grupo": "Tareas", "texto": "2 clases → 1 salida (d = 0/1, clase si y ≥ 0,5). k clases → k salidas one-hot, gana la mayor.", "refs": [{"archivo": "experimentos.py", "funcion": "salidas_deseadas", "linea": 113, "fin": 119, "ini_funcion": 113, "fin_funcion": 119}, {"archivo": "formulas.py", "funcion": "clase_de_la_salida", "linea": 356, "fin": 366, "ini_funcion": 356, "fin_funcion": 366}]}, {"id": "superficie", "nombre": "Superficie de separación", "grupo": "Tareas", "texto": " → n1, n2, n3)", "-0,00008  -0,01013  0,00148"]], "ref": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "linea": 186, "fin": 188, "ini_funcion": 179, "fin_funcion": 188}}, {"titulo": "Fin de la época: un solo ajuste", "texto": "Con los 4 patrones sumados se aplica Peso·1 + G·0,3 a todos los pesos. Diapositiva: −0,017·1 + 0,032·0,3 = −0,007 (G real 0,03294; la diapositiva lo trunca a 0,032).", "valores": [["Salida: antes", "-0,017  -0,893  0,148"], ["G·0,3", "0,00988  0,00658  0,00633"], ["Salida: después", "-0,007  -0,886  0,154"], ["Oculta (x1→): después", "-0,424  -0,743  -0,961"], ["Oculta (x2→): después", "0,358  -0,581  -0,468"]], "ref": {"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}}, {"titulo": "Se mide la época siguiente", "texto": "En la siguiente vuelta del ciclo, la misma pasada que acumula G mide E y el ECM con los pesos nuevos y los guarda en el historial. Por eso historial[1] = pesos después de 1 ajuste.", "valores": [], "ref": {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 299, "fin": 299, "ini_funcion": 253, "fin_funcion": 351}}], "profesor": [{"tema": "Código", "pregunta": "¿Dónde está el backpropagation en su código?", "respuesta": "El método completo está en red_neuronal.py. La propagación es propagar_con; los deltas de atrás hacia adelante están en RedNeuronal.retropropagar; la suma Entrada·Delta en _acumular y el ajuste en _aplicar, que llama a ajuste_profesor (F8). El ciclo que los une es RedNeuronal.entrenar.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 152, "fin": 172, "ini_funcion": 152, "fin_funcion": 172}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 288, "fin": 288, "ini_funcion": 253, "fin_funcion": 351}]}, {"tema": "Código", "pregunta": "Muéstreme dónde calcula el delta de la camada.", "respuesta": "En formulas.py, delta_camada: suma peso·delta de todas las neuronas de la capa siguiente y multiplica por y(1 − y) de la neurona. Se llama desde retropropagar, dentro del ciclo que va de la última capa oculta a la primera.", "refs": [{"archivo": "formulas.py", "funcion": "delta_camada", "linea": 283, "fin": 292, "ini_funcion": 283, "fin_funcion": 292}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 169, "fin": 169, "ini_funcion": 152, "fin_funcion": 172}]}, {"tema": "Código", "pregunta": "¿Cómo hace para que funcione con n capas y n neuronas?", "respuesta": "Los pesos son listas pesos[c][j][i] creadas a partir de la estructura. Todos los ciclos usan range(len(...)) de esas listas, así que no hay ningún número fijo de capas o neuronas en el código. La estructura se arma en ejecutar con [entradas] + ocultas + [salidas].", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.__init__", "linea": 86, "fin": 86, "ini_funcion": 66, "fin_funcion": 103}, {"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 51, "fin": 51, "ini_funcion": 44, "fin_funcion": 61}]}, {"tema": "Código", "pregunta": "¿Por qué recorre las capas al revés?", "respuesta": "Porque el delta de una capa oculta necesita los deltas de la capa siguiente. Primero se calcula el de la salida y luego range(L − 2, −1, −1) va de la última oculta a la primera.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.retropropagar", "linea": 164, "fin": 164, "ini_funcion": 152, "fin_funcion": 172}]}, {"tema": "Código", "pregunta": "¿Los deltas se calculan con los pesos viejos o nuevos?", "respuesta": "Con los viejos. En el ajuste por época todos los patrones se procesan antes de _aplicar, y dentro de retropropagar se usan self.pesos sin modificar. Por eso el orden \"de atrás hacia adelante\" del ajuste no cambia el resultado.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 334, "fin": 334, "ini_funcion": 253, "fin_funcion": 351}]}, {"tema": "Código", "pregunta": "¿Dónde hace el ajuste por época y dónde por patrón?", "respuesta": "En entrenar: si self.ajuste == \"epoca\" se acumula G para todos los patrones y se llama _aplicar una vez; en la rama else se baraja y se llama _aplicar después de cada patrón.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 281, "fin": 281, "ini_funcion": 253, "fin_funcion": 351}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 339, "fin": 339, "ini_funcion": 253, "fin_funcion": 351}]}, {"tema": "Código", "pregunta": "¿Cómo calcula la exponencial si no puede usar librerías?", "respuesta": "Reducción de rango: x = k·ln2 + r con |r| ≤ 0,35, e^x = 2^k·e^r. e^r con la serie de Taylor (unos 15 términos) y 2^k por cuadrados sucesivos. ln 2 se calcula una vez con la serie de atanh.", "refs": [{"archivo": "formulas.py", "funcion": "exponencial", "linea": 216, "fin": 241, "ini_funcion": 216, "fin_funcion": 241}]}, {"tema": "Código", "pregunta": "¿Qué pasa si la suma S es muy negativa? ¿No se desborda la exponencial?", "respuesta": "No, porque para S negativo la sigmoide usa e^S/(1 + e^S): el argumento siempre es ≤ 0. Además la exponencial devuelve 0 por debajo de −745.", "refs": [{"archivo": "formulas.py", "funcion": "sigmoide", "linea": 257, "fin": 265, "ini_funcion": 257, "fin_funcion": 265}]}, {"tema": "Código", "pregunta": "¿Dónde está el sesgo y cuál es su entrada?", "respuesta": "sesgos[c][j] por neurona; en la suma ponderada se suma θ·x0 con x0 = −1. Al acumular, su G usa x0 como entrada.", "refs": [{"archivo": "formulas.py", "funcion": "suma_ponderada", "linea": 254, "fin": 254, "ini_funcion": 247, "fin_funcion": 254}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal._acumular", "linea": 188, "fin": 188, "ini_funcion": 179, "fin_funcion": 188}]}, {"tema": "Código", "pregunta": "¿Cómo dibuja la superficie de separación si la red no tiene ecuación?", "respuesta": "Evalúo la red en una rejilla 3D y busco dónde F15 cambia de signo. Cada cubo se parte en 6 tetraedros y en las aristas con cambio de signo interpolo el punto de corte: salen triángulos que matplotlib solo dibuja (marching tetrahedra).", "refs": [{"archivo": "graficas.py", "funcion": "triangulos_superficie", "linea": 132, "fin": 173, "ini_funcion": 132, "fin_funcion": 173}, {"archivo": "graficas.py", "funcion": "_corte", "linea": 125, "fin": 129, "ini_funcion": 125, "fin_funcion": 129}]}, {"tema": "Código", "pregunta": "¿Cómo se guardan los pesos de cada época para las gráficas?", "respuesta": "_registrar_estado añade una copia de pesos y sesgos a historial_pesos en cada época. pesos_en_epoca(k) los devuelve y valores_capa/nombres_pesos los ordenan para las gráficas.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal._registrar_estado", "linea": 236, "fin": 243, "ini_funcion": 236, "fin_funcion": 243}, {"archivo": "red_neuronal.py", "funcion": "RedNeuronal.pesos_en_epoca", "linea": 133, "fin": 137, "ini_funcion": 133, "fin_funcion": 137}]}, {"tema": "Código", "pregunta": "¿Cómo funciona el clic derecho que abre el código?", "respuesta": "_ver_codigo asocia <Button-3> del control con una función; _abrir_codigo toma funcion.__code__.co_filename y co_firstlineno y ejecuta code -g ruta:línea; si no está el comando code, abre vscode://file/ruta:línea.", "refs": [{"archivo": "main.py", "funcion": "Aplicacion._abrir_codigo", "linea": 362, "fin": 376, "ini_funcion": 362, "fin_funcion": 376}]}, {"tema": "Código", "pregunta": "¿Dónde comprueba que se detuvo porque divergió?", "respuesta": "En entrenar, después de registrar el estado: si E no es finito o el ECM creció un millón de veces respecto al inicial, marca divergio = True. En regresión también si el ECM terminó por encima del inicial.", "refs": [{"archivo": "red_neuronal.py", "funcion": "RedNeuronal.entrenar", "linea": 306, "fin": 306, "ini_funcion": 253, "fin_funcion": 351}]}, {"tema": "Concepto", "pregunta": "¿Por qué el XOR necesita capa oculta?", "respuesta": "Porque no es linealmente separable: ninguna recta deja (0,0),(1,1) de un lado y (0,1),(1,0) del otro. Cada neurona oculta traza una frontera y la salida las combina. Sin capa oculta mi simulador da 50 % en el XOR 3D.", "refs": [{"archivo": "aleatorio.py", "funcion": "generar_xor", "linea": 104, "fin": 125, "ini_funcion": 104, "fin_funcion": 125}]}, {"tema": "Concepto", "pregunta": "¿Por qué sin sesgo el ejemplo se queda en 75 %?", "respuesta": "Con (0,0) y sin sesgo, S = 0 en todas las ocultas: salen 0,5 siempre. La salida para ese patrón depende solo de la suma de los pesos de salida y no puede acomodar los 4 patrones. Con sesgo llega a 100 % en 1778 épocas.", "refs": [{"archivo": "experimentos.py", "funcion": "ejecutar_ejemplo_clase", "linea": 182, "fin": 202, "ini_funcion": 182, "fin_funcion": 202}]}, {"tema": "Concepto", "pregunta": "¿Por qué su G da 0,033 y la diapositiva 0,032?", "respuesta": "El valor exacto es 0,03294: la diapositiva trunca. El peso nuevo da −0,007 en ambos casos. Además el cálculo del tercer peso en la diapositiva usa −0,017 y 0,032 por error de copia; lo correcto es 0,148 + 0,021·0,3 = 0,154.", "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}]}, {"tema": "Concepto", "pregunta": "¿Qué es el momento en su fórmula?", "respuesta": "En la fórmula de clase multiplica el peso: con 1 es gradiente puro; con menos de 1 encoge los pesos cada época (con 0,99 el XOR queda en 50 %). El momento clásico suma α·ΔW anterior y acelera; lo dejé como opción.", "refs": [{"archivo": "formulas.py", "funcion": "ajuste_profesor", "linea": 301, "fin": 304, "ini_funcion": 301, "fin_funcion": 304}, {"archivo": "formulas.py", "funcion": "ajuste_momento_clasico", "linea": 307, "fin": 313, "ini_funcion": 307, "fin_funcion": 313}]}, {"tema": "Concepto", "pregunta": "¿Por qué la tasa por defecto es tan pequeña?", "respuesta": "Con lotes G suma los N patrones sin promediar, el paso es ≈ tasa × N. Con 300 puntos y tasa 0,1 el paso es 30; con tasa 0,3 ya es 90 y la red se satura (33 %). El simulador muestra ese valor debajo de la tasa.", "refs": [{"archivo": "experimentos.py", "funcion": "guia_paso", "linea": 293, "fin": 317, "ini_funcion": 293, "fin_funcion": 317}]}, {"tema": "Concepto", "pregunta": "¿Qué es la saturación y cómo la detecta?", "respuesta": "Sumas S muy grandes llevan la sigmoide a 0 o 1, y' ≈ 0 y no aprende. No da NaN; se detecta porque la exactitud queda igual al azar (100/k %) y aparece un aviso.", "refs": [{"archivo": "experimentos.py", "funcion": "advertencia", "linea": 325, "fin": 345, "ini_funcion": 325, "fin_funcion": 345}]}, {"tema": "Concepto", "pregunta": "¿Por qué normaliza las entradas?", "respuesta": "Con entradas de 0 a 10 las sumas crecen y saturan la sigmoide. Llevarlas a [0,1] mantiene S en la zona donde la derivada es grande. Las gráficas se dibujan en unidades originales.", "refs": [{"archivo": "formulas.py", "funcion": "normalizar", "linea": 418, "fin": 423, "ini_funcion": 418, "fin_funcion": 423}]}, {"tema": "Concepto", "pregunta": "¿Cómo hace regresión con la misma red?", "respuesta": "La salida usa y = S (derivada 1, delta = e); las ocultas siguen siendo sigmoides, que son las que permiten curvas. También puede usar salida sigmoide con y normalizada a [0,1]. Se mide con R².", "refs": [{"archivo": "red_neuronal.py", "funcion": "propagar_con", "linea": 56, "fin": 56, "ini_funcion": 44, "fin_funcion": 61}, {"archivo": "experimentos.py", "funcion": "ejecutar_regresion", "linea": 208, "fin": 247, "ini_funcion": 208, "fin_funcion": 247}]}, {"tema": "Concepto", "pregunta": "¿Qué gráfica muestra con 5 entradas?", "respuesta": "El espacio no se puede dibujar, pero sí errores, ECM, exactitud, pesos capa por capa, todos los pesos y el diagrama de la red. En regresión, real vs. predicho.", "refs": [{"archivo": "graficas.py", "funcion": "dibujar_espacio", "linea": 200, "fin": 219, "ini_funcion": 200, "fin_funcion": 219}]}, {"te
